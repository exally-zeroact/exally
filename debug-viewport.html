<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; font-size: 13px; background: #f0faf4; }
#log {
  position: fixed;
  top: 0; left: 0; right: 0;
  background: rgba(255,255,255,0.97);
  border-bottom: 2px solid #52B788;
  padding: 8px;
  z-index: 9999;
}
.row { display: flex; justify-content: space-between; padding: 3px 6px; border-bottom: 1px solid #eee; }
.label { color: #888; font-size: 11px; }
.val { font-weight: bold; }
#kbrow { background: #fff3cd; padding: 4px 6px; border-radius: 4px; margin: 3px 0; }
#status { padding: 4px 6px; border-radius: 4px; font-weight: bold; font-size: 12px; }
.content { padding-top: 200px; }
input { display: block; width: calc(100% - 20px); margin: 10px; padding: 12px; font-size: 16px; border: 2px solid #52B788; border-radius: 8px; }
.spacer { height: 400px; background: linear-gradient(#f0faf4, #e0f0e8); margin: 0 10px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #999; }
</style>
</head>
<body>
<div id="log">
  <div class="row"><span class="label">innerHeight</span><span class="val" id="iH">-</span></div>
  <div class="row"><span class="label">vv.height</span><span class="val" id="vH">-</span></div>
  <div class="row"><span class="label">vv.offsetTop</span><span class="val" id="vOT">-</span></div>
  <div id="kbrow"><span class="label">kbH = </span><span class="val" id="kbH">-</span></div>
  <div id="status">待機中</div>
</div>
<div class="content">
  <input type="text" placeholder="① ここをタップ（上）" id="inp1">
  <div class="spacer">↓ スクロール ↓</div>
  <input type="text" placeholder="② ここをタップ（中）" id="inp2">
  <div class="spacer">↓ スクロール ↓</div>
  <input type="text" placeholder="③ ここをタップ（下）" id="inp3">
  <div style="height:200px"></div>
</div>
<script>
function update(source) {
  var vv = window.visualViewport;
  if (!vv) return;
  var iH = window.innerHeight;
  var vH = Math.round(vv.height);
  var vOT = Math.round(vv.offsetTop);
  var kbH = iH - vH - vOT;
  document.getElementById('iH').textContent = iH + 'px';
  document.getElementById('vH').textContent = vH + 'px';
  document.getElementById('vOT').textContent = vOT + 'px';
  document.getElementById('kbH').textContent = kbH + 'px → ' + (kbH > 100 ? '🔴キーボード' : '🟢なし');
  document.getElementById('status').textContent = source + ' | kbH=' + kbH;
  document.getElementById('status').style.background = kbH > 100 ? '#ffd' : '#dfd';
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function(){ update('resize'); });
  window.visualViewport.addEventListener('scroll', function(){ update('scroll'); });
}
['inp1','inp2','inp3'].forEach(function(id){
  document.getElementById(id).addEventListener('focus', function(){
    update('focus直後[' + id + ']');
    setTimeout(function(){ update('focus+400ms[' + id + ']'); }, 400);
  });
});
update('初期');
</script>
</body>
</html>
