<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Exally グリッド</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Noto+Sans+JP&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:'Noto Sans JP',sans-serif;
  background:#F0FAF4;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  user-select:none;
  position:fixed;
  width:100%; top:0; left:0;
}
#header {
  background:#3D9E72;
  color:#fff;
  height:48px;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
}
.header-btns { display:flex; gap:6px; }
.hbtn {
  background:rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.35);
  color:#fff;
  border-radius:6px;
  padding:5px 10px;
  font-size:12px;
  cursor:pointer;
  font-family:inherit;
}
.hbtn.primary { background:#fff; color:#3D9E72; font-weight:700; border:none; }
#formula-bar {
  height:34px;
  background:#fff;
  border-bottom:1px solid #C8ECD8;
  display:flex;
  align-items:center;
  padding:0 8px;
  gap:8px;
  flex-shrink:0;
}
#cell-addr {
  width:64px;
  font-size:12px;
  font-weight:700;
  color:#3D9E72;
  text-align:center;
  background:#F0FAF4;
  border:1px solid #C8ECD8;
  border-radius:4px;
  padding:2px 4px;
  font-family:inherit;
}
#formula-input {
  flex:1;
  font-size:16px;
  border:none;
  outline:none;
  font-family:inherit;
  color:#1A2B22;
  background:transparent;
}
#grid-wrap {
  flex:1;
  position:relative;
  overflow:hidden;
}
#grid-canvas {
  position:absolute;
  top:0; left:0;
  cursor:cell;
  display:block;
}
#cell-input {
  position:absolute;
  display:none;
  border:2px solid #1E88E5;
  outline:none;
  font-size:16px;
  font-family:inherit;
  padding:1px 3px;
  background:#fff;
  z-index:20;
  resize:none;
  overflow:hidden;
}
#ai-panel-wrap {
  flex-shrink:0;
  background:#fff;
  border-top:2px solid #3D9E72;
}
#ai-panel-handle {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 12px;
  cursor:pointer;
  user-select:none;
  background:#F0FAF4;
  border-bottom:1px solid #C8ECD8;
}
#ai-panel-handle .ai-label {
  font-size:13px;
  font-weight:700;
  color:#3D9E72;
  display:flex;
  align-items:center;
  gap:6px;
}
#ai-panel-handle .ai-arrow { color:#3D9E72; font-size:11px; transition:transform 0.2s; }
#ai-panel-wrap.open .ai-arrow { transform:rotate(180deg); }
#ai-panel-body { display:none; padding:10px; flex-direction:column; gap:6px; }
#ai-panel-wrap.open #ai-panel-body { display:flex; }
@media (max-width:768px) {
  #ai-panel-wrap.open {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    height:100vh;
    z-index:600;
    display:flex;
    flex-direction:column;
    background:#fff;
  }
  #ai-panel-wrap.open #ai-panel-body {
    flex:1;
    overflow:hidden;
    flex-direction:column;
    padding:10px;
    gap:6px;
  }
  #ai-panel-wrap.open #ai-response-area {
    flex:1;
    max-height:none;
    overflow-y:auto;
  }
  #ai-panel-wrap.open #ai-input-row { flex-shrink:0; }
}
#ai-response-area { display:none; max-height:220px; overflow-y:auto; background:#F8FEFC; border-radius:8px; padding:8px 10px; font-size:12px; }
#ai-response-area.show { display:block; }

/* PC：右パネル */
#ai-float-btn { display:none; }
@media (min-width:769px) {
  #ai-float-btn {
    display:flex;
    position:fixed;
    bottom:48px;
    right:20px;
    background:#3D9E72;
    color:#fff;
    border:none;
    border-radius:24px;
    padding:8px 16px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    z-index:500;
    align-items:center;
    gap:6px;
    box-shadow:0 2px 12px rgba(61,158,114,0.4);
    font-family:'Noto Sans JP',sans-serif;
    transition:background 0.2s;
  }
  #ai-float-btn:hover { background:#2E8A5F; }
  #ai-panel-wrap {
    position:fixed;
    right:0; bottom:0;
    width:420px;
    height:92vh;
    border:1px solid #C8ECD8;
    border-radius:12px 0 0 0;
    box-shadow:-4px 0 24px rgba(0,0,0,0.1);
    z-index:500;
    flex-shrink:unset;
    transform:translateX(100%);
    transition:transform 0.25s ease;
    overflow:hidden;
    display:block !important;
    border-top:none;
  }
  #ai-panel-wrap.open {
    transform:translateX(0);
    height:92vh !important;
  }
  #ai-panel-handle {
    border-bottom:1px solid #C8ECD8;
    background:#F0FAF4;
  }
  #ai-panel-body {
    display:flex !important;
    flex-direction:column;
    height:calc(92vh - 44px);
    overflow:hidden;
    padding:10px;
    gap:6px;
  }
  #ai-response-area {
    flex:1;
    max-height:none !important;
    overflow-y:auto;
  }
  #ai-input-row { flex-shrink:0; }
}
#ai-response-area { display:flex; flex-direction:column; max-height:180px; overflow-y:auto; background:#fff; border-radius:8px; padding:4px 6px; font-size:12px; }
#ai-response-area.show { max-height:none; flex:1; }

#ai-input {

}
#sheet-tabs {

.sheet-tab {

#loading {

}
#loading.hide { display:none; }
.spinner {
  width:36px; height:36px;

/* 右クリックメニュー */
#ctx-menu {
  position:fixed;
  background:#fff;

<body>

<div id="loading"><div class="spinner"></div><p>グリッドを起動中...</p></div>

<div id="ctx-menu">
  <div class="ctx-item" onclick="ctxCopy()">📋 コピー <span style="color:#aaa;font-size:11px;margin-left:auto">Ctrl+C</span></div>
  <div class="ctx-item" onclick="ctxPaste()">📌 貼り付け <span style="color:#aaa;font-size:11px;margin-left:auto">Ctrl+V</span></div>

  <div class="ctx-item" onclick="ctxInsertRow()">➕ 行を挿入</div>
  <div class="ctx-item" onclick="ctxInsertCol()">➕ 列を挿入</div>
</div>

<div id="header">
  <div style="display:flex;align-items:center;gap:6px;">
    <span style="font-size:18px;">⚡</span>
    <span style="font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:#fff;letter-spacing:-0.5px;">Exally</span>
  </div>
  <div class="header-btns">
    <button class="hbtn" onclick="saveXlsx()">💾</button>
    <button class="hbtn primary" onclick="alert('AIチャット（実装予定）')">💬 AIに聞く</button>
  </div>
</div>

<div id="formula-bar">
  <input id="cell-addr" type="text" value="A1" readonly>
  <input id="formula-input" type="text" placeholder="値や数式を入力してね">
</div>

<div id="grid-wrap">
  <canvas id="grid-canvas"></canvas>
  <textarea id="cell-input" rows="1"></textarea>
</div>

<button id="ai-float-btn" onclick="toggleAiPanel()">💬 AIに話しかける</button>

<div id="ai-panel-wrap">
  <div id="ai-panel-handle" onclick="toggleAiPanel()">
    <div class="ai-label">💬 AIに話しかける</div>
    <div class="ai-arrow">▲</div>
  </div>
  <div id="ai-panel-body">
    <div id="ai-response-area"></div>
    <div id="ai-input-row">
      <textarea id="ai-input" rows="1" placeholder="「売上の合計出して」「この表どういう意味？」"></textarea>
      <button id="ai-send" onclick="sendToAI()">▶</button>
    </div>
  </div>
</div>

<div id="sheet-tabs">
  <button class="sheet-tab active" onclick="switchSheet(0)">Sheet1</button>
  <button class="sheet-tab" onclick="switchSheet(1)">Sheet2</button>
  <button id="add-sheet-btn" onclick="addSheet()">＋</button>
</div>

<script>
// ===== 定数 =====
var ROW_H = 22, COL_W = 80, HDR_W = 46, HDR_H = 22, ROWS = 1000, COLS = 26;

// カラー
var C_HDR_BG     = '#F0FAF4';
var C_HDR_TXT    = '#4A6B5A';
var C_HDR_LINE   = '#C8D8D0';
var C_CELL_BG    = '#ffffff';
var C_CELL_LINE  = '#D8E8E0';
var C_SEL_BG     = '#E3F2FD';
var C_SEL_HDR    = '#BBDEFB';
var C_SEL_BORDER = '#1E88E5';
var C_CELL_TXT   = '#1A2B22';
var C_FORMULA    = '#1565C0';

// ===== 状態 =====
var sheets = [
  { name:'Sheet1', data:{}, colW:{}, rowH:{} },
  { name:'Sheet2', data:{}, colW:{}, rowH:{} }
];
var activeSheet = 0;
var selR1=0, selC1=0, selR2=0, selC2=0;
var scrollTop=0, scrollLeft=0;
var scale=1;
var canvas, ctx, wrap, wrapW, wrapH, dpr=1;
var editingCell=null;
var touchState=null;

// ===== 初期化 =====
window.addEventListener('resize', function(){
  dpr = window.devicePixelRatio || 1; resize(); render();
});
window.addEventListener('load', function() {
  canvas = document.getElementById('grid-canvas');
  ctx = canvas.getContext('2d');
  wrap = document.getElementById('grid-wrap');
  dpr = window.devicePixelRatio || 1;
  resize(); render(); bindEvents();
  document.getElementById('loading').classList.add('hide');
  setTimeout(function(){ scrollTop=0; scrollLeft=0; scale=1; resize(); render(); }, 150);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function(){
      document.body.style.height = window.visualViewport.height + 'px';
      dpr = window.devicePixelRatio || 1; resize(); render();
    });
  }
});
function resize() {
  wrapW = wrap.clientWidth; wrapH = wrap.clientHeight;
  canvas.width  = Math.round(wrapW * dpr);
  canvas.height = Math.round(wrapH * dpr);
  canvas.style.width  = wrapW + 'px';
  canvas.style.height = wrapH + 'px';
}

// ===== データ =====
function getCell(r,c){ return sheets[activeSheet].data[r+','+c] || {v:'',f:'',d:''}; }
function setCell(r,c,v){
  var d = v; // 表示値
  if(v && v[0]==='=') d = evalFormula(v, r, c);
  sheets[activeSheet].data[r+','+c] = {v:v, f:v, d:String(d)};
}

// A1形式 → {r,c}
function addrToRC(addr){
  var m = addr.match(/^([A-Z]+)(\d+)$/i);
  if(!m) return null;
  var col=0; for(var i=0;i<m[1].length;i++) col=col*26+(m[1].toUpperCase().charCodeAt(i)-64);
  return {r:parseInt(m[2])-1, c:col-1};
}

// セルの数値を取得
function getCellNum(r,c){
  var cell = getCell(r,c);
  var v = cell.d || cell.v;
  return parseFloat(v) || 0;
}

// 簡易計算エンジン
function evalFormula(formula, selfR, selfC){
  try {
    var expr = formula.substring(1).trim();

    // SUM(A1:C1) / AVERAGE(A1:C1)
    var rangeFunc = expr.match(/^(SUM|AVERAGE|COUNT|MAX|MIN)\(([A-Z]+\d+):([A-Z]+\d+)\)$/i);
    if(rangeFunc){
      var fn = rangeFunc[1].toUpperCase();
      var rc1 = addrToRC(rangeFunc[2]);
      var rc2 = addrToRC(rangeFunc[3]);
      if(!rc1||!rc2) return formula;
      var vals=[];
      for(var r=Math.min(rc1.r,rc2.r);r<=Math.max(rc1.r,rc2.r);r++)
        for(var c=Math.min(rc1.c,rc2.c);c<=Math.max(rc1.c,rc2.c);c++)
          vals.push(getCellNum(r,c));
      if(fn==='SUM') return vals.reduce(function(a,b){return a+b;},0);
      if(fn==='AVERAGE') return vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : 0;
      if(fn==='COUNT') return vals.filter(function(v){return v!==0||getCell(r,c).v!=='';}).length;
      if(fn==='MAX') return Math.max.apply(null,vals);
      if(fn==='MIN') return Math.min.apply(null,vals);
    }

    // セル参照を数値に置換して評価（例：=A1+B1*C1）
    expr = expr.replace(/([A-Z]+\d+)/gi, function(addr){
      var rc = addrToRC(addr);
      if(!rc) return 0;
      // 循環参照防止
      if(rc.r===selfR && rc.c===selfC) return 0;
      return getCellNum(rc.r, rc.c);
    });

    // 数値式のみ評価（安全のためnumberのみ）
    if(/^[\d\s\.\+\-\*\/\(\)]+$/.test(expr)){
      var result = Function('"use strict";return ('+expr+')')();
      return isNaN(result) ? formula : Math.round(result*10000)/10000;
    }

    return formula;
  } catch(e) {
    return '#ERR';
  }
}
function cW(c){ return (sheets[activeSheet].colW[c] || COL_W) * scale; }
function rH(r){ return (sheets[activeSheet].rowH[r] || ROW_H) * scale; }

// ===== 座標 =====
function colX(c){ var x=HDR_W-scrollLeft; for(var i=0;i<c;i++) x+=cW(i); return x; }
function rowY(r){ var y=HDR_H-scrollTop;  for(var i=0;i<r;i++) y+=rH(i);  return y; }
function xToC(x){ var cx=HDR_W-scrollLeft; for(var c=0;c<COLS;c++){ var w=cW(c); if(x<cx+w) return c; cx+=w; } return COLS-1; }
function yToR(y){ var cy=HDR_H-scrollTop;  for(var r=0;r<ROWS;r++){ var h=rH(r);  if(y<cy+h) return r; cy+=h; } return ROWS-1; }

// ===== 描画 =====
function render() {
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,wrapW,wrapH);

  // 表示範囲
  var sC=xToC(HDR_W), sR=yToR(HDR_H), eC=sC, eR=sR;
  while(colX(eC)<wrapW && eC<COLS-1) eC++;
  while(rowY(eR)<wrapH && eR<ROWS-1) eR++;

  // 1. セル白背景（一括）
  ctx.fillStyle=C_CELL_BG;
  ctx.fillRect(HDR_W,HDR_H,wrapW,wrapH);

  // 2. 選択セル背景
  ctx.fillStyle=C_SEL_BG;
  for(var r=Math.max(sR,selR1);r<=Math.min(eR+1,selR2);r++)
    for(var c=Math.max(sC,selC1);c<=Math.min(eC+1,selC2);c++)
      ctx.fillRect(colX(c),rowY(r),cW(c),rH(r));

  // 3. グリッド線（セルエリアのみ）
  ctx.strokeStyle=C_CELL_LINE; ctx.lineWidth=0.5; ctx.beginPath();
  for(var r=sR;r<=eR+2;r++){
    var ly=Math.round(rowY(r))+0.5; if(ly<=HDR_H||ly>wrapH) continue;
    ctx.moveTo(HDR_W,ly); ctx.lineTo(wrapW,ly);
  }
  for(var c=sC;c<=eC+2;c++){
    var lx=Math.round(colX(c))+0.5; if(lx<=HDR_W||lx>wrapW) continue;
    ctx.moveTo(lx,HDR_H); ctx.lineTo(lx,wrapH);
  }
  ctx.stroke();

  // 4. セルテキスト
  for(var r=sR;r<=eR+1;r++) for(var c=sC;c<=eC+1;c++) drawText(r,c);

  // 5. ヘッダー背景
  ctx.fillStyle=C_HDR_BG;
  ctx.fillRect(0,0,wrapW,HDR_H);   // 列ヘッダー行
  ctx.fillRect(0,0,HDR_W,wrapH);   // 行ヘッダー列

  // 6. 選択ヘッダー強調
  ctx.fillStyle=C_SEL_HDR;
  for(var c=selC1;c<=selC2;c++) ctx.fillRect(colX(c),0,cW(c),HDR_H);
  for(var r=selR1;r<=selR2;r++) ctx.fillRect(0,rowY(r),HDR_W,rH(r));

  // 7. ヘッダー線（ヘッダー背景の上に描く）
  ctx.strokeStyle=C_HDR_LINE; ctx.lineWidth=0.5; ctx.beginPath();
  // 列ヘッダーの縦区切り
  for(var c=sC;c<=eC+2;c++){
    var lx=Math.round(colX(c))+0.5; if(lx<=HDR_W||lx>wrapW) continue;
    ctx.moveTo(lx,0); ctx.lineTo(lx,HDR_H);
  }
  // 行ヘッダーの横区切り
  for(var r=sR;r<=eR+2;r++){
    var ly=Math.round(rowY(r))+0.5; if(ly<=HDR_H||ly>wrapH) continue;
    ctx.moveTo(0,ly); ctx.lineTo(HDR_W,ly);
  }
  // ヘッダー境界線（太め）
  ctx.moveTo(HDR_W+0.5,0); ctx.lineTo(HDR_W+0.5,wrapH);
  ctx.moveTo(0,HDR_H+0.5); ctx.lineTo(wrapW,HDR_H+0.5);
  ctx.stroke();

  // 8. ヘッダーテキスト
  ctx.textBaseline='middle';
  // 列（A,B,C...）中央揃え
  ctx.textAlign='center';
  var fw=scale<0.75?'normal':'bold';
  var fs=Math.max(9,Math.round(11*Math.min(scale,1.5)));
  ctx.font=fw+' '+fs+'px "Noto Sans JP",sans-serif';
  for(var c=sC;c<=eC+1;c++){
    var x=colX(c),w=cW(c); if(x+w<0||x>wrapW) continue;
    ctx.fillStyle=(c>=selC1&&c<=selC2)?'#1E88E5':C_HDR_TXT;
    ctx.fillText(colLetter(c),x+w/2,HDR_H/2);
  }
  // 行（1,2,3...）右寄せ（Excelと同じ）
  ctx.textAlign='right';
  var rf=Math.max(9,Math.round(11*Math.min(scale,1.5)));
  ctx.font=rf+'px "Noto Sans JP",sans-serif';
  for(var r=sR;r<=eR+1;r++){
    var y=rowY(r),h=rH(r); if(y+h<0||y>wrapH) continue;
    ctx.fillStyle=(r>=selR1&&r<=selR2)?'#1E88E5':C_HDR_TXT;
    ctx.fillText(r+1,HDR_W-4,y+h/2);
  }

  // 9. 左上角
  ctx.fillStyle=C_HDR_BG;
  ctx.fillRect(0,0,HDR_W,HDR_H);
  ctx.strokeStyle=C_HDR_LINE; ctx.lineWidth=0.5;
  ctx.strokeRect(0.5,0.5,HDR_W-0.5,HDR_H-0.5);

  // 10. 選択枠（最前面）
  drawSel();
}

function drawText(r,c){
  var x=colX(c),y=rowY(r),w=cW(c),h=rH(r);
  if(x+w<HDR_W||x>wrapW||y+h<HDR_H||y>wrapH) return;
  var cell=getCell(r,c);
  var display = (cell.d!==undefined && cell.d!=='') ? cell.d : cell.v;
  if(!display) return;
  // 数式セルは計算結果を黒で表示（数式バーに数式を表示）
  var isFormula = cell.f && cell.f[0]==='=';
  var showRaw = isFormula && cell.d===cell.f; // 計算できなかった場合のみ青
  ctx.fillStyle = showRaw ? C_FORMULA : C_CELL_TXT;
  ctx.font=Math.max(9,Math.min(13,Math.round(12*scale)))+'px "Noto Sans JP",sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.save(); ctx.rect(x+1,y,w-2,h); ctx.clip();
  ctx.fillText(display,x+4,y+h/2);
  ctx.restore();
}

function drawSel(){
  var x1=colX(selC1),y1=rowY(selR1);
  var x2=colX(selC2)+cW(selC2),y2=rowY(selR2)+rH(selR2);
  ctx.save();
  ctx.rect(HDR_W,HDR_H,wrapW-HDR_W,wrapH-HDR_H); ctx.clip();
  ctx.strokeStyle=C_SEL_BORDER; ctx.lineWidth=2;
  ctx.strokeRect(x1+1,y1+1,x2-x1-2,y2-y1-2);
  // ハンドル（右下）
  ctx.fillStyle=C_SEL_BORDER;
  ctx.beginPath(); ctx.arc(x2,y2,7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x2,y2,3.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ===== ユーティリティ =====
function colLetter(c){ var s=''; c+=1; while(c>0){ s=String.fromCharCode(64+((c-1)%26+1))+s; c=Math.floor((c-1)/26); } return s; }
function cellAddr(r,c){ return colLetter(c)+(r+1); }
function updateBar(){
  var addr = cellAddr(selR1,selC1);
  var scaleStr = scale!==1 ? ' ×'+Math.round(scale*10)/10 : '';
  document.getElementById('cell-addr').value = addr+scaleStr;
  var cell=getCell(selR1,selC1);
  document.getElementById('formula-input').value=cell.f||'';
}
var anchorR=0, anchorC=0; // Shift選択のアンカー（開始点）
var activeR=0, activeC=0; // Shift選択の移動端

function sel(r1,c1,r2,c2){
  selR1=Math.min(r1,r2); selC1=Math.min(c1,c2);
  selR2=Math.max(r1,r2); selC2=Math.max(c1,c2);
  // 通常選択ではアンカーを更新
  anchorR=r1; anchorC=c1;
  activeR=r2; activeC=c2;
  scrollToCell(selR1,selC1); updateBar(); render();
}

// Shift拡張専用（アンカーを動かさずactiveだけ動かす）
function selShift(ar,ac){
  activeR=Math.max(0,Math.min(ROWS-1,ar));
  activeC=Math.max(0,Math.min(COLS-1,ac));
  selR1=Math.min(anchorR,activeR); selC1=Math.min(anchorC,activeC);
  selR2=Math.max(anchorR,activeR); selC2=Math.max(anchorC,activeC);
  scrollToCell(activeR,activeC); updateBar(); render();
}

// ===== スクロール =====
function scrollToCell(r,c){
  var x=colX(c),y=rowY(r),w=cW(c),h=rH(r);
  if(x<HDR_W) scrollLeft=Math.max(0,scrollLeft-(HDR_W-x));
  if(x+w>wrapW) scrollLeft+=(x+w-wrapW)+4;
  if(y<HDR_H) scrollTop=Math.max(0,scrollTop-(HDR_H-y));
  if(y+h>wrapH) scrollTop+=(y+h-wrapH)+4;
}

// ===== イベント =====
function bindEvents(){
  // マウス
  canvas.addEventListener('mousedown',onMD);
  canvas.addEventListener('mousemove',onMM);
  document.addEventListener('mouseup',function(){ if(touchState&&touchState.type==='msel') touchState=null; });
  canvas.addEventListener('dblclick',function(e){
    var p=cPos(e); if(p.x>HDR_W&&p.y>HDR_H) startEdit(selR1,selC1);
  });
  // 右クリック
  canvas.addEventListener('contextmenu',function(e){
    e.preventDefault();
    showCtxMenu(e.clientX,e.clientY);
  });
  document.addEventListener('click',function(){ hideCtxMenu(); });
  // ホイール
  canvas.addEventListener('wheel',function(e){
    e.preventDefault();
    // deltaMode: 0=px, 1=行, 2=ページ
    var mult = e.deltaMode === 1 ? 20 : e.deltaMode === 2 ? 300 : 1;
    var dx = e.deltaX * mult;
    var dy = e.deltaY * mult;

    if(e.ctrlKey || e.metaKey){
      // Ctrl+ホイール or タッチパッドピンチ → ズーム
      var factor = dy > 0 ? 0.95 : 1.05;
      var p = cPos(e);
      var newScale = Math.max(0.5, Math.min(4, scale * factor));
      var ratio = newScale / scale;
      var cx = p.x - HDR_W;
      var cy = p.y - HDR_H;
      scrollLeft = Math.max(0, (scrollLeft + cx) * ratio - cx);
      scrollTop  = Math.max(0, (scrollTop  + cy) * ratio - cy);
      scale = newScale;
    } else {
      // 通常スクロール（マウス・タッチパッド2本指）
      scrollTop  = Math.max(0, scrollTop  + dy);
      scrollLeft = Math.max(0, scrollLeft + dx);
    }
    render();
  },{passive:false});
  // タッチ
  canvas.addEventListener('touchstart',onTS,{passive:false});
  canvas.addEventListener('touchmove',onTM,{passive:false});
  canvas.addEventListener('touchend',onTE,{passive:false});
  // キーボード
  document.addEventListener('keydown',onKD);
  // 数式バー
  var fi=document.getElementById('formula-input');
  fi.addEventListener('input',function(){ setCell(selR1,selC1,this.value); render(); });
  fi.addEventListener('keydown',function(e){ if(e.key==='Enter'){this.blur();render();} });
  // セル入力
  var ci=document.getElementById('cell-input');
  ci.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commitEdit();moveSel(1,0);}
    else if(e.key==='Tab'){e.preventDefault();commitEdit();moveSel(0,1);}
    else if(e.key==='Escape') cancelEdit();
  });
  ci.addEventListener('blur',commitEdit);
  var ai = document.getElementById('ai-input');
  ai.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      sendToAI();
    }
  });
}

function cPos(e){ var r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function pDist(e){ var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY; return Math.sqrt(dx*dx+dy*dy); }

function nearHandle(x,y){
  var bx=colX(selC2)+cW(selC2),by=rowY(selR2)+rH(selR2);
  return Math.hypot(x-bx,y-by)<30;
}

// マウス
function onMD(e){
  if(e.button!==0) return; commitEdit(); hideCtxMenu();
  var p=cPos(e);

  // 列ヘッダークリック → 列全体選択
  if(p.y<HDR_H&&p.x>=HDR_W){
    var c=xToC(p.x);
    if(e.shiftKey){
      // Shift+クリック：現在選択からこの列まで拡張
      sel(0, Math.min(selC1,c), ROWS-1, Math.max(selC2,c));
    } else {
      sel(0,c,ROWS-1,c);
    }
    return;
  }

  // 行ヘッダークリック → 行全体選択
  if(p.x<HDR_W&&p.y>=HDR_H){
    var r=yToR(p.y);
    if(e.shiftKey){
      // Shift+クリック：現在選択からこの行まで拡張
      sel(Math.min(selR1,r), 0, Math.max(selR2,r), COLS-1);
    } else {
      sel(r,0,r,COLS-1);
    }
    return;
  }

  if(p.x<HDR_W||p.y<HDR_H) return;
  var c=xToC(p.x),r=yToR(p.y);

  // Shift+セルクリック：範囲拡張
  if(e.shiftKey){
    sel(selR1,selC1,r,c);
    return;
  }

  sel(r,c,r,c);
  touchState={type:'msel',startR:r,startC:c};
}
function onMM(e){
  if(!touchState||touchState.type!=='msel') return;
  var p=cPos(e); if(p.x<HDR_W||p.y<HDR_H) return;
  selR2=yToR(p.y); selC2=xToC(p.x); updateBar(); render();
}

// タッチ
function onTS(e){
  e.preventDefault();
  if(e.touches.length>=2){
    var r=canvas.getBoundingClientRect();
    touchState={type:'pinch',dist:pDist(e),sc:scale,sst:scrollTop,ssl:scrollLeft,
      cx:((e.touches[0].clientX+e.touches[1].clientX)/2)-r.left,
      cy:((e.touches[0].clientY+e.touches[1].clientY)/2)-r.top};
    return;
  }
  var t=e.touches[0],r=canvas.getBoundingClientRect();
  var x=t.clientX-r.left,y=t.clientY-r.top;
  if(nearHandle(x,y)){
    touchState={type:'handle'}; return;
  }
  touchState={type:'pending',sx:t.clientX,sy:t.clientY,sst:scrollTop,ssl:scrollLeft,time:Date.now()};
}
function onTM(e){
  e.preventDefault();
  if(!touchState) return;
  if(e.touches.length>=2&&touchState.type!=='pinch'){
    var r=canvas.getBoundingClientRect();
    touchState={type:'pinch',dist:pDist(e),sc:scale,sst:scrollTop,ssl:scrollLeft,
      cx:((e.touches[0].clientX+e.touches[1].clientX)/2)-r.left,
      cy:((e.touches[0].clientY+e.touches[1].clientY)/2)-r.top};
    return;
  }
  if(touchState.type==='pinch'&&e.touches.length>=2){
    var d=pDist(e),ns=Math.max(0.5,Math.min(4,touchState.sc*(d/touchState.dist)));
    var ratio=ns/touchState.sc;
    scrollLeft=Math.max(0,(touchState.ssl+(touchState.cx-HDR_W))*ratio-(touchState.cx-HDR_W));
    scrollTop=Math.max(0,(touchState.sst+(touchState.cy-HDR_H))*ratio-(touchState.cy-HDR_H));
    scale=ns; render(); return;
  }
  if(e.touches.length!==1) return;
  var t=e.touches[0];
  var dx=t.clientX-touchState.sx,dy=t.clientY-touchState.sy;
  if(touchState.type==='pending'&&(Math.abs(dx)>5||Math.abs(dy)>5)) touchState.type='scroll';
  if(touchState.type==='scroll'){
    scrollLeft=Math.max(0,touchState.ssl-dx);
    scrollTop=Math.max(0,touchState.sst-dy);
    render(); return;
  }
  if(touchState.type==='handle'){
    var r=canvas.getBoundingClientRect();
    var x=t.clientX-r.left,y=t.clientY-r.top;
    if(x>HDR_W&&y>HDR_H){
      selR2=Math.max(selR1,yToR(y)); selC2=Math.max(selC1,xToC(x));
      updateBar(); render();
    }
  }
}
function onTE(e){
  e.preventDefault();
  if(!touchState||touchState.type!=='pending'){touchState=null;return;}
  var r=canvas.getBoundingClientRect();
  var x=touchState.sx-r.left,y=touchState.sy-r.top;
  if(x>HDR_W&&y>HDR_H){
    commitEdit();
    var c=xToC(x),r2=yToR(y);
    if(selR1===r2&&selC1===c&&(Date.now()-touchState.time)<400){
      document.getElementById('formula-input').focus();
      document.getElementById('formula-input').select();
    } else { sel(r2,c,r2,c); }
  }
  touchState=null;
}

// キー
function onKD(e){
  if(editingCell) return;
  if(document.activeElement===document.getElementById('formula-input')) return;
  if(document.activeElement===document.getElementById('ai-input')) return;
  var moved=false;

  // Shift+矢印：選択範囲拡張
  if(e.shiftKey){
    if(e.key==='ArrowDown') { selShift(activeR+1,activeC); moved=true; }
    if(e.key==='ArrowUp')   { selShift(activeR-1,activeC); moved=true; }
    if(e.key==='ArrowRight'){ selShift(activeR,activeC+1); moved=true; }
    if(e.key==='ArrowLeft') { selShift(activeR,activeC-1); moved=true; }
  } else {
    if(e.key==='ArrowDown') {moveSel(1,0);moved=true;}
    if(e.key==='ArrowUp')   {moveSel(-1,0);moved=true;}
    if(e.key==='ArrowRight'){moveSel(0,1);moved=true;}
    if(e.key==='ArrowLeft') {moveSel(0,-1);moved=true;}
  }

  if(e.key==='Enter'){startEdit(selR1,selC1);moved=true;}
  if(e.key==='Delete'||e.key==='Backspace'){setCell(selR1,selC1,'');updateBar();render();moved=true;}
  if(e.key==='c'&&(e.ctrlKey||e.metaKey)){ ctxCopy(); moved=true; }
  if(e.key==='v'&&(e.ctrlKey||e.metaKey)){ ctxPaste(); moved=true; }
  if(moved) e.preventDefault();
  if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){
    e.preventDefault();
    startEdit(selR1,selC1,e.key);
  }
}

// コピペバッファ
var copyBuffer = null;

// 右クリックメニュー
function showCtxMenu(x,y){
  var m=document.getElementById('ctx-menu');
  m.style.left=x+'px'; m.style.top=y+'px';
  // 画面外にはみ出さないように調整
  m.classList.add('show');
  var rect=m.getBoundingClientRect();
  if(rect.right>window.innerWidth) m.style.left=(x-rect.width)+'px';
  if(rect.bottom>window.innerHeight) m.style.top=(y-rect.height)+'px';
}
function hideCtxMenu(){ document.getElementById('ctx-menu').classList.remove('show'); }

function ctxCopy(){
  // 選択範囲の値をタブ区切りでコピー
  var rows=[];
  for(var r=selR1;r<=selR2;r++){
    var row=[];
    for(var c=selC1;c<=selC2;c++) row.push(getCell(r,c).v||'');
    rows.push(row.join('\t'));
  }
  var text=rows.join('\n');
  copyBuffer={r1:selR1,c1:selC1,r2:selR2,c2:selC2,text:text};
  if(navigator.clipboard) navigator.clipboard.writeText(text).catch(function(){});
  hideCtxMenu();
}

function ctxPaste(){
  if(!copyBuffer) return;
  var rows = copyBuffer.text.split('\n').map(function(r){ return r.split('\t'); });
  var copyRows = rows.length;
  var copyCols = rows[0].length;

  // 1セルコピーの場合は選択範囲全体に展開（Excel動作）
  if(copyRows===1 && copyCols===1){
    var val = rows[0][0];
    for(var r=selR1;r<=selR2;r++)
      for(var c=selC1;c<=selC2;c++) setCell(r,c,val);
  } else {
    // 複数セルコピーは左上から順に貼り付け
    rows.forEach(function(row,ri){
      row.forEach(function(val,ci){ setCell(selR1+ri,selC1+ci,val); });
    });
  }
  render(); hideCtxMenu();
}

function ctxDelete(){
  for(var r=selR1;r<=selR2;r++)
    for(var c=selC1;c<=selC2;c++) setCell(r,c,'');
  updateBar(); render(); hideCtxMenu();
}

function ctxInsertRow(){
  // 選択行より下を1行シフト
  var data=sheets[activeSheet].data;
  var newData={};
  Object.keys(data).forEach(function(k){
    var parts=k.split(','); var r=parseInt(parts[0]),c=parseInt(parts[1]);
    if(r>=selR1) newData[(r+1)+','+c]=data[k];
    else newData[k]=data[k];
  });
  sheets[activeSheet].data=newData;
  render(); hideCtxMenu();
}

function ctxInsertCol(){
  var data=sheets[activeSheet].data;
  var newData={};
  Object.keys(data).forEach(function(k){
    var parts=k.split(','); var r=parseInt(parts[0]),c=parseInt(parts[1]);
    if(c>=selC1) newData[r+','+(c+1)]=data[k];
    else newData[k]=data[k];
  });
  sheets[activeSheet].data=newData;
  render(); hideCtxMenu();
}
function moveSel(dr,dc){
  var r=Math.max(0,Math.min(ROWS-1,selR1+dr));
  var c=Math.max(0,Math.min(COLS-1,selC1+dc));
  sel(r,c,r,c);
}

// セル編集
function startEdit(r,c,init){
  commitEdit();
  editingCell={r:r,c:c};
  var x=colX(c),y=rowY(r),w=cW(c),h=rH(r);
  var el=document.getElementById('cell-input');
  el.style.left=x+'px'; el.style.top=y+'px';
  el.style.width=Math.max(w,80)+'px'; el.style.height=h+'px';
  el.style.display='block';
  el.value=init!==undefined?init:(getCell(r,c).v||'');
  el.focus();
  if(init!==undefined) el.setSelectionRange(init.length,init.length);
  else el.setSelectionRange(el.value.length,el.value.length);
}
function commitEdit(){
  if(!editingCell) return;
  var el=document.getElementById('cell-input');
  setCell(editingCell.r,editingCell.c,el.value);
  el.style.display='none'; el.value='';
  editingCell=null; updateBar(); render();
}
function cancelEdit(){
  if(!editingCell) return;
  document.getElementById('cell-input').style.display='none';
  document.getElementById('cell-input').value='';
  editingCell=null;
}

// シート
function switchSheet(idx){
  commitEdit(); activeSheet=idx;
  scrollTop=0;scrollLeft=0;scale=1;selR1=0;selC1=0;selR2=0;selC2=0;
  updateBar(); render();
  document.querySelectorAll('.sheet-tab').forEach(function(t,i){t.classList.toggle('active',i===idx);});
}
function addSheet(){
  var idx=sheets.length;
  sheets.push({name:'Sheet'+(idx+1),data:{},colW:{},rowH:{}});
  var tabs=document.getElementById('sheet-tabs');
  var btn=document.createElement('button');
  btn.className='sheet-tab'; btn.textContent=sheets[idx].name;
  btn.onclick=(function(i){return function(){switchSheet(i);};})(idx);
  tabs.insertBefore(btn,document.getElementById('add-sheet-btn'));
  switchSheet(idx);
}

// AIパネル
function toggleAiPanel(){
  var wrap = document.getElementById('ai-panel-wrap');
  wrap.classList.toggle('open');
  // PCではフローティングボタンのテキストを切り替え
  if(window.innerWidth >= 769){
    var btn = document.getElementById('ai-float-btn');
    if(btn) btn.textContent = wrap.classList.contains('open') ? '✕ 閉じる' : '💬 AIに話しかける';
  }
}

// 選択範囲のデータを取得
function getSelectionData(){
  var cells = [];
  for(var r=selR1;r<=selR2;r++){
    for(var c=selC1;c<=selC2;c++){
      var cell=getCell(r,c);
      if(cell.v) cells.push(colLetter(c)+(r+1)+':'+cell.v);
    }
  }
  var addr = selR1===selR2&&selC1===selC2
    ? colLetter(selC1)+(selR1+1)
    : colLetter(selC1)+(selR1+1)+':'+colLetter(selC2)+(selR2+1);
  return { addr:addr, cells:cells };
}

// AI送信
// index6.htmlと同じ colorizeFormula
function colorizeFormula(text){
  var lp='[\\(（]',rp='[\\)）]',cm='[,，]';
  var reVL=new RegExp('=VLOOKUP'+lp+'([^,，]+)'+cm+'([^,，]+)'+cm+'([^,，]+)'+cm+'\\s*(FALSE|TRUE)\\s*'+rp,'gi');
  text=text.replace(reVL,function(m,a1,a2,a3,a4){return '=VLOOKUP(<span class="arg-blue">'+a1.trim()+'</span>, <span class="arg-orange">'+a2.trim()+'</span>, <span class="arg-purple">'+a3.trim()+'</span>, <span class="arg-green">'+a4.trim()+'</span>)';});
  var reSI=new RegExp('=SUMIF'+lp+'([^,，]+)'+cm+'([^,，]+)'+cm+'([^)）]+)'+rp,'gi');
  text=text.replace(reSI,function(m,a1,a2,a3){return '=SUMIF(<span class="arg-blue">'+a1.trim()+'</span>, <span class="arg-orange">'+a2.trim()+'</span>, <span class="arg-purple">'+a3.trim()+'</span>)';});
  var reIF=new RegExp('=IF'+lp+'([^,，]+)'+cm+'([^,，]+)'+cm+'([^)）]+)'+rp,'gi');
  text=text.replace(reIF,function(m,a1,a2,a3){return '=IF(<span class="arg-blue">'+a1.trim()+'</span>, <span class="arg-orange">'+a2.trim()+'</span>, <span class="arg-purple">'+a3.trim()+'</span>)';});
  var reCI=new RegExp('=COUNTIF'+lp+'([^,，]+)'+cm+'([^)）]+)'+rp,'gi');
  text=text.replace(reCI,function(m,a1,a2){return '=COUNTIF(<span class="arg-blue">'+a1.trim()+'</span>, <span class="arg-orange">'+a2.trim()+'</span>)';});
  var b='\uD83D\uDD35',o='\uD83D\uDFE0',p='\uD83D\uDFE3',g='\uD83D\uDFE2';
  text=text.replace(new RegExp(b+'\\s*\\*\\*([^*]+)\\*\\*','g'),b+' <span class="arg-blue">$1</span>');
  text=text.replace(new RegExp(o+'\\s*\\*\\*([^*]+)\\*\\*','g'),o+' <span class="arg-orange">$1</span>');
  text=text.replace(new RegExp(p+'\\s*\\*\\*([^*]+)\\*\\*','g'),p+' <span class="arg-purple">$1</span>');
  text=text.replace(new RegExp(g+'\\s*\\*\\*([^*]+)\\*\\*','g'),g+' <span class="arg-green">$1</span>');
  return text;
}

// index6.htmlと同じ colorizeFormulaBlock
function colorizeFormulaBlock(f){
  f=f.replace(/VLOOKUP\s*\(([^,()]+),\s*([^,()]+),\s*([^,()]+),\s*(FALSE|TRUE)\s*\)/gi,function(m,a1,a2,a3,a4){return 'VLOOKUP(<span class="arg-blue">'+a1.trim()+'</span>, <span class="arg-orange">'+a2.trim()+'</span>, <span class="arg-purple">'+a3.trim()+'</span>, <span class="arg-green">'+a4.trim()+'</span>)';});
  f=f.replace(/SUMIF\s*\(([^,()]+),\s*([^,()]+),\s*([^,()]+)\)/gi,function(m,a1,a2,a3){return 'SUMIF(<span class="arg-blue">'+a1.trim()+'</span>, <span class="arg-orange">'+a2.trim()+'</span>, <span class="arg-purple">'+a3.trim()+'</span>)';});
  f=f.replace(/COUNTIF\s*\(([^,()]+),\s*([^,()]+)\)/gi,function(m,a1,a2){return 'COUNTIF(<span class="arg-blue">'+a1.trim()+'</span>, <span class="arg-orange">'+a2.trim()+'</span>)';});
  f=f.replace(/(?<![A-Z])IF\s*\(([^,()]+),\s*([^,()]+),\s*([^,()]+)\)/gi,function(m,a1,a2,a3){return 'IF(<span class="arg-blue">'+a1.trim()+'</span>, <span class="arg-orange">'+a2.trim()+'</span>, <span class="arg-purple">'+a3.trim()+'</span>)';});
  f=f.replace(/ROUND\s*\(([^,()]+),\s*([^,()]+)\)/gi,function(m,a1,a2){return 'ROUND(<span class="arg-blue">'+a1.trim()+'</span>, <span class="arg-orange">'+a2.trim()+'</span>)';});
  return f;
}

// index6.htmlと同じ表示形式（コードブロックを先に退避してからcolorize）
function formatAIText(text){
  var blocks = [];
  // ① コードブロックを先に退避
  text = text.replace(/```[\w]*\n?([\s\S]*?)```/g, function(m,c){
    var raw = c.trim();
    var colored = colorizeFormulaBlock(raw);
    blocks.push({colored:colored, raw:raw});
    return '\x00BLOCK'+(blocks.length-1)+'\x00';
  });
  // ② コードブロック外にcolorizeFormula適用
  text = colorizeFormula(text);
  // ③ インラインコード
  text = text.replace(/`([^`]+)`/g,'<span class="inline-code">$1</span>');
  // ④ 改行
  text = text.replace(/\n/g,'<br>');
  // ⑤ コードブロックを復元
  text = text.replace(/\x00BLOCK(\d+)\x00/g, function(m,idx){
    var b = blocks[parseInt(idx)];
    var safeRaw = b.raw.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return '<div class="formula-block">'+b.colored+'</div>'
      +'<button class="copy-btn" onclick="copyText(this,\''+safeRaw+'\')">📋 数式をコピー</button>';
  });
  return text;
}

function copyText(btn, text){
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(function(){
    var orig = btn.textContent;
    btn.textContent = '✓ コピーしました';
    setTimeout(function(){ btn.textContent = orig; }, 1500);
  });
}
function extractWriteAction(text){
  var idx = text.indexOf('"action"');
  if(idx === -1) return null;
  var start = text.lastIndexOf('{', idx);
  if(start === -1) return null;
  var depth = 0;
  for(var i = start; i < text.length; i++){
    if(text[i] === '{') depth++;
    else if(text[i] === '}'){
      depth--;
      if(depth === 0){
        try {
          var json = JSON.parse(text.substring(start, i+1));
          if(json.action === 'write') return { json:json, start:start, end:i+1 };
        } catch(e) { return null; }
      }
    }
  }
  return null;
}

var aiHistory = [];

function addAIChatMsg(type, text){
  var resp = document.getElementById('ai-response-area');
  resp.classList.add('show');
  var div = document.createElement('div');
  div.className = 'ai-msg-' + type;
  var bubble = document.createElement('div');
  bubble.className = 'ai-bubble';
  if(type === 'ai'){
    bubble.innerHTML = formatAIText(text);
  } else {
    bubble.textContent = text;
  }
  div.appendChild(bubble);
  resp.appendChild(div);
  resp.scrollTop = resp.scrollHeight;
}

async function sendToAI(){
  var input = document.getElementById('ai-input');
  var text = input.value.trim();
  if(!text) return;

  var selData = getSelectionData();
  var ctxNote = selData.cells.length > 0
    ? '\n【選択セル:'+selData.addr+'→'+selData.cells.join(',')+'】'
    : '\n【選択セル:'+selData.addr+'（空）】';

  var writeInstruction = '\nセルに値や数式を入れる場合は返答の最後に必ず {"action":"write","cells":[{"addr":"A1","value":"=SUM(A1:C1)"}]} の形式のJSONを1行で出力してね。';
  var userMsg = text + ctxNote + writeInstruction;

  addAIChatMsg('user', text);
  input.value = '';
  document.getElementById('ai-send').disabled = true;

  var thinkDiv = document.createElement('div');
  thinkDiv.className = 'ai-msg-ai';
  thinkDiv.id = 'ai-thinking';
  thinkDiv.innerHTML = '<span style="color:#3D9E72;font-size:12px;">考え中...</span>';
  document.getElementById('ai-response-area').appendChild(thinkDiv);
  document.getElementById('ai-response-area').scrollTop = 9999;

  try {
    var res = await fetch('/api/claude', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: userMsg, history: aiHistory })
    });
    var data = await res.json();
    var aiText = data.text || 'エラーが発生したよ';

    var th = document.getElementById('ai-thinking');
    if(th) th.remove();

    // 括弧カウントでJSONを正確に抽出
    var extracted = extractWriteAction(aiText);
    var displayText = extracted
      ? (aiText.substring(0, extracted.start) + aiText.substring(extracted.end)).trim()
      : aiText;

    addAIChatMsg('ai', displayText);

    aiHistory.push({role:'user',content:text});
    aiHistory.push({role:'assistant',content:aiText});
    if(aiHistory.length > 40) aiHistory = aiHistory.slice(-40);

    if(extracted) showWriteConfirm(extracted.json.cells);

  } catch(e) {
    var th = document.getElementById('ai-thinking');
    if(th) th.remove();
    addAIChatMsg('ai','AIに接続できなかったよ。もう一度試してみてね。');
  }
  document.getElementById('ai-send').disabled = false;
}

// セル書き込み確認モーダル
function showWriteConfirm(cells){
  var existing = document.getElementById('write-confirm');
  if(existing) existing.remove();

  var list = cells.map(function(c){ return c.addr+' → '+c.value; }).join('\n');
  var modal = document.createElement('div');
  modal.id = 'write-confirm';
  modal.style.cssText = 'position:fixed;bottom:120px;left:50%;transform:translateX(-50%);width:90%;max-width:420px;background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 24px rgba(0,0,0,0.15);z-index:999;font-family:inherit;';
  modal.innerHTML = '<div style="font-size:13px;font-weight:700;color:#1A2B22;margin-bottom:10px;">✏️ このセルに書き込むよ</div>'
    +'<div style="font-size:12px;color:#3D9E72;background:#F0FAF4;border-radius:8px;padding:8px 10px;margin-bottom:12px;white-space:pre;">'+list+'</div>'
    +'<div style="display:flex;gap:8px;">'
    +'<button onclick="cancelWrite()" style="flex:1;padding:10px;border:1px solid #C8ECD8;border-radius:8px;background:#fff;color:#4A6B5A;font-size:13px;font-family:inherit;cursor:pointer;">キャンセル</button>'
    +'<button onclick="doWrite()" style="flex:1;padding:10px;border:none;border-radius:8px;background:#3D9E72;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;">書き込む ✅</button>'
    +'</div>';
  modal.dataset.cells = JSON.stringify(cells);
  document.body.appendChild(modal);
}

function cancelWrite(){
  var m = document.getElementById('write-confirm');
  if(m) m.remove();
}

function doWrite(){
  var m = document.getElementById('write-confirm');
  if(!m) return;
  var cells = JSON.parse(m.dataset.cells);
  cells.forEach(function(cell){
    // A1形式をr,cに変換
    var match = cell.addr.match(/^([A-Z]+)(\d+)$/);
    if(!match) return;
    var c = 0;
    for(var i=0;i<match[1].length;i++) c=c*26+(match[1].charCodeAt(i)-64);
    c -= 1;
    var r = parseInt(match[2]) - 1;
    setCell(r, c, cell.value);
  });
  render();
  m.remove();
  // 書き込んだセルを選択
  if(cells.length > 0){
    var first = cells[0].addr.match(/^([A-Z]+)(\d+)$/);
    if(first){
      var c=0; for(var i=0;i<first[1].length;i++) c=c*26+(first[1].charCodeAt(i)-64); c-=1;
      var r=parseInt(first[2])-1;
      sel(r,c,r,c);
    }
  }
}
