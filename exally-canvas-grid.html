 * canvas-formula-engine.js - HyperFormula数式エンジンラッパー

var hf = null;

var HF_ERR = {
  'DIV_BY_ZERO':'#DIV/0!','NUM':'#NUM!','NA':'#N/A','VALUE':'#VALUE!',
  'REF':'#REF!','NAME':'#NAME?','CYCLE':'#CYCLE!','NULL':'#NULL!',
  'SPILL':'#SPILL!','GETTING_DATA':'#GETTING_DATA'
};

// ================================================================
// 初期化・シート管理
// ================================================================
function initFormulaEngine(sheetNames) {
  if(typeof HyperFormula === 'undefined') return;
  hf = HyperFormula.buildEmpty({licenseKey:'gpl-v3'});
  for(var i=0;i<sheetNames.length;i++) hf.addSheet(sheetNames[i]);
}
// シート名→HF数値IDに変換（HFはindex番号を要求）
function _hfSid(sheet){
  if(typeof sheet==='number') return sheet;
  try{ var id=hf.getSheetId(sheet); return (id!==null&&id!==undefined)?id:0; }catch(e){return 0;}
}
function addSheetToEngine(name) {
  if(!hf) return;
  try { hf.addSheet(name); } catch(e) {}
}

// ================================================================
// 内部ヘルパー
// ================================================================
function _hfGetDisplay(sheet, r, c) {
  try {
    var val = hf.getCellValue({sheet:_hfSid(sheet), row:r, col:c});
    if(val===null||val===undefined) return '';
    if(typeof val==='object'&&val.type) return HF_ERR[val.type]||('#'+val.type);
    return String(val);
  } catch(e) { return '#ERR'; }
}
function _toRC(addr) {
  var m = addr.match(/^([A-Z]+)(\d+)$/i);
  if(!m) return null;
  var col=0;
  for(var i=0;i<m[1].length;i++) col=col*26+(m[1].toUpperCase().charCodeAt(i)-64);
  return {r:parseInt(m[2])-1, c:col-1};
}
function _getRangeVals(sheet, rangeStr) {
  var m = rangeStr.match(/^([A-Z]+\d+):([A-Z]+\d+)$/i);
  if(!m||!hf) return [];
  var s=_toRC(m[1]),e=_toRC(m[2]),vals=[];
  for(var r=s.r;r<=e.r;r++)
    for(var c=s.c;c<=e.c;c++){
      var v=hf.getCellValue({sheet:_hfSid(sheet),row:r,col:c});
      if(typeof v==='number') vals.push(v);
    }
  return vals;
}
function _getRangeAll(sheet, rangeStr) {
  var m = rangeStr.match(/^([A-Z]+\d+):([A-Z]+\d+)$/i);
  if(!m||!hf) return [];
  var s=_toRC(m[1]),e=_toRC(m[2]),vals=[];
  for(var r=s.r;r<=e.r;r++)
    for(var c=s.c;c<=e.c;c++)
      vals.push(hf.getCellValue({sheet:_hfSid(sheet),row:r,col:c}));
  return vals;
}
function _getSingleVal(sheet, ref) {
  var rc=_toRC(ref);
  if(!rc||!hf) return null;
  return hf.getCellValue({sheet:_hfSid(sheet),row:rc.r,col:rc.c});
}

// --- TEXT書式 ---
function _applyTextFormat(num, fmt) {
  if(/^#,##0(\.0+)?$/.test(fmt)) {
    var d=fmt.indexOf('.')===-1?0:fmt.length-fmt.indexOf('.')-1;
    return num.toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});
  }
  if(/^0+(\.0+)?$/.test(fmt)) {
    var d=fmt.indexOf('.')===-1?0:fmt.length-fmt.indexOf('.')-1;
    return num.toFixed(d);
  }
  if(fmt==='0%') return Math.round(num*100)+'%';
  if(fmt==='0.00%') return (num*100).toFixed(2)+'%';
  if(fmt==='¥#,##0'||fmt==='\\#,##0') return '¥'+Math.round(num).toLocaleString('ja-JP');
  return String(num);
}

// --- 統計 ---
function _jsRank(val,vals,order){var s=vals.slice().sort(function(a,b){return order===0?b-a:a-b;});var r=s.indexOf(val)+1;return r>0?r:'#N/A';}

function _jsPercentrank(vals,x,sig){var s=vals.slice().sort(function(a,b){return a-b;}),n=s.length;var below=s.filter(function(v){return v<x;}).length;var rank=below/(n-1);var d=Math.pow(10,sig||3);return Math.floor(rank*d)/d;}
function _jsFrequency(data,bins){var r=new Array(bins.length+1).fill(0);data.forEach(function(v){var p=false;for(var i=0;i<bins.length;i++){if(v<=bins[i]){r[i]++;p=true;break;}}if(!p)r[bins.length]++;});return r;}
function _jsKurt(vals){var n=vals.length;if(n<4)return '#DIV/0!';var mean=vals.reduce(function(a,b){return a+b;})/n;var s2=vals.reduce(function(a,v){return a+Math.pow(v-mean,2);},0)/(n-1);var s=Math.sqrt(s2);var sum4=vals.reduce(function(a,v){return a+Math.pow((v-mean)/s,4);},0);return (n*(n+1))/((n-1)*(n-2)*(n-3))*sum4-3*(n-1)*(n-1)/((n-2)*(n-3));}

// --- 回帰・予測 ---
function _jsSlope(ys,xs){var n=ys.length,sx=0,sy=0,sxx=0,sxy=0;for(var i=0;i<n;i++){sx+=xs[i];sy+=ys[i];sxx+=xs[i]*xs[i];sxy+=xs[i]*ys[i];}return(n*sxy-sx*sy)/(n*sxx-sx*sx);}

function _jsMdeterm(m){var n=m.length;if(n===1)return m[0][0];if(n===2)return m[0][0]*m[1][1]-m[0][1]*m[1][0];var det=0;for(var c=0;c<n;c++){var sub=m.slice(1).map(function(r){return r.filter(function(_,ci){return ci!==c;});});det+=Math.pow(-1,c)*m[0][c]*_jsMdeterm(sub);}return det;}

function _jsIrr(values,guess){guess=guess===undefined?0.1:guess;var rate=guess;for(var iter=0;iter<1000;iter++){var npv=0,dnpv=0;values.forEach(function(v,i){var f=Math.pow(1+rate,i);npv+=v/f;dnpv-=i*v/Math.pow(1+rate,i+1);});if(Math.abs(dnpv)<1e-15)break;var nr=rate-npv/dnpv;if(Math.abs(nr-rate)<1e-10){rate=nr;break;}rate=nr;}return rate;}
function _jsXirr(values,dates,guess){guess=guess===undefined?0.1:guess;var d0=dates[0],rate=guess;for(var iter=0;iter<1000;iter++){var npv=0,dnpv=0;values.forEach(function(v,i){var t=(dates[i]-d0)/365,f=Math.pow(1+rate,t);npv+=v/f;dnpv-=t*v/Math.pow(1+rate,t+1);});if(Math.abs(dnpv)<1e-15)break;var nr=rate-npv/dnpv;if(Math.abs(nr-rate)<1e-10){rate=nr;break;}rate=nr;}return rate;}
function _jsVdb(cost,salvage,life,start,end,factor){factor=factor||2;var total=0;for(var p=Math.floor(start);p<Math.ceil(end);p++){var s=Math.max(start,p),e2=Math.min(end,p+1);var book=cost;for(var i=0;i<p;i++)book-=Math.min(book*factor/life,book-salvage);total+=Math.min(book*factor/life,book-salvage)*(e2-s);}return total;}

function _jsConvert(num,from,to){var u={'g':1,'kg':1000,'mg':0.001,'lbm':453.592,'ozm':28.3495,'ton':1e6,'m':1,'km':1000,'cm':0.01,'mm':0.001,'mi':1609.344,'yd':0.9144,'ft':0.3048,'in':0.0254,'sec':1,'min':60,'hr':3600,'day':86400,'yr':31557600,'Pa':1,'atm':101325,'bar':100000,'psi':6894.76,'J':1,'cal':4.184,'eV':1.602e-19,'l':0.001,'ml':0.000001,'gal':0.003785,'qt':0.000946,'pt':0.000473};if(from==='C'&&to==='F')return num*9/5+32;if(from==='F'&&to==='C')return(num-32)*5/9;if(from==='C'&&to==='K')return num+273.15;if(from==='K'&&to==='C')return num-273.15;if(from==='F'&&to==='K')return(num-32)*5/9+273.15;if(from==='K'&&to==='F')return(num-273.15)*9/5+32;if(!u[from]||!u[to])return'#N/A';return num*u[from]/u[to];}

function _jsDbFunc(func,sheet,dbRange,field,criteriaRange){if(!hf)return'#VALUE!';var m=dbRange.match(/^([A-Z]+\d+):([A-Z]+\d+)$/i);if(!m)return'#VALUE!';var s=_toRC(m[1]),e=_toRC(m[2]);var headers=[];for(var c=s.c;c<=e.c;c++)headers.push(hf.getCellValue({sheet:_hfSid(sheet),row:s.r,col:c}));var fieldIdx=typeof field==='number'?field-1:headers.indexOf(field);if(fieldIdx<0)return'#VALUE!';var cm=criteriaRange.match(/^([A-Z]+\d+):([A-Z]+\d+)$/i);if(!cm)return'#VALUE!';var cs=_toRC(cm[1]);var critField=hf.getCellValue({sheet:_hfSid(sheet),row:cs.r,col:cs.c});var critVal=hf.getCellValue({sheet:_hfSid(sheet),row:cs.r+1,col:cs.c});var critFieldIdx=headers.indexOf(critField);var results=[];for(var r=s.r+1;r<=e.r;r++){if(String(hf.getCellValue({sheet:_hfSid(sheet),row:r,col:s.c+critFieldIdx}))===String(critVal)){results.push(hf.getCellValue({sheet:_hfSid(sheet),row:r,col:s.c+fieldIdx}));}}var nums=results.filter(function(v){return typeof v==='number';});if(func==='SUM')return nums.reduce(function(a,b){return a+b;},0);if(func==='AVG')return nums.length?nums.reduce(function(a,b){return a+b;})/nums.length:'#DIV/0!';if(func==='CNT')return nums.length;if(func==='CNTA')return results.filter(function(v){return v!==null&&v!==undefined;}).length;if(func==='MAX')return nums.length?Math.max.apply(null,nums):'#NUM!';if(func==='MIN')return nums.length?Math.min.apply(null,nums):'#NUM!';if(func==='PROD')return nums.reduce(function(a,b){return a*b;},1);if(func==='GET')return results.length===1?results[0]:'#NUM!';if(func==='STD'){var n=nums.length;if(n<2)return'#DIV/0!';var mean=nums.reduce(function(a,b){return a+b;})/n;return Math.sqrt(nums.reduce(function(a,v){return a+Math.pow(v-mean,2);},0)/(n-1));}if(func==='STDP'){var n=nums.length;if(!n)return'#DIV/0!';var mean=nums.reduce(function(a,b){return a+b;})/n;return Math.sqrt(nums.reduce(function(a,v){return a+Math.pow(v-mean,2);},0)/n);}if(func==='VAR'){var n=nums.length;if(n<2)return'#DIV/0!';var mean=nums.reduce(function(a,b){return a+b;})/n;return nums.reduce(function(a,v){return a+Math.pow(v-mean,2);},0)/(n-1);}if(func==='VARP'){var n=nums.length;if(!n)return'#DIV/0!';var mean=nums.reduce(function(a,b){return a+b;})/n;return nums.reduce(function(a,v){return a+Math.pow(v-mean,2);},0)/n;}return'#VALUE!';}

// 引数文字列をネスト考慮でパース
function _parseFuncArgs(str) {
  var args=[], depth=0, current='', inStr=false, strChar='';
  for(var i=0;i<str.length;i++){
    var ch=str[i];
    if(!inStr&&(ch==='"'||ch==="'")){inStr=true;strChar=ch;current+=ch;continue;}
    if(inStr&&ch===strChar){inStr=false;current+=ch;continue;}
    if(!inStr&&ch==='(')depth++;
    if(!inStr&&ch===')')depth--;
    if(!inStr&&ch===','&&depth===0){args.push(current.trim());current='';continue;}
    current+=ch;
  }
  if(current.trim())args.push(current.trim());
  return args;
}

// LET展開（再帰・セル参照名変数はスキップ）
function _jsLetExpand(formula) {
  if(!formula||formula[0]!=='=') return formula;
  var result = formula;
  for(var iter=0;iter<10;iter++){
    var f = result.slice(1).trim();
    if(!/^LET\s*\(/i.test(f)) break;
    var inside = f.match(/^LET\s*\((.+)\)$/is);
    if(!inside) break;
    var args = _parseFuncArgs(inside[1]);
    if(!args||args.length<3||args.length%2===0) break;
    var body = args[args.length-1];
    for(var i=args.length-3;i>=0;i-=2){
      var name=args[i].trim(), val=args[i+1].trim();
      if(/^[A-Z]+\d+$/i.test(name)) continue; // セル参照名の変数はスキップ
      if(/^\d/.test(name)) continue;
      body = body.replace(new RegExp('\\b'+name+'\\b','g'), '('+val+')');
    }
    result = '='+body;
  }
  return result;
}

// LAMBDA即時呼び出し展開
function _jsLambdaExpand(formula) {
  if(!formula||formula[0]!=='=') return formula;
  var f = formula.slice(1).trim();
  var mL = f.match(/^LAMBDA\s*\((.+)\)\s*\((.+)\)$/is);
  if(!mL) return formula;
  var defArgs = _parseFuncArgs(mL[1]);
  if(defArgs.length<2) return formula;
  var params=defArgs.slice(0,-1), body=defArgs[defArgs.length-1];
  var callArgs = _parseFuncArgs(mL[2]);
  if(callArgs.length!==params.length) return formula;
  params.forEach(function(p,i){
    var name=p.trim();
    if(/^[A-Z]+\d+$/i.test(name)) return;
    body = body.replace(new RegExp('\\b'+name+'\\b','g'),'('+callArgs[i].trim()+')');
  });
  return '='+body;
}

// REDUCE(initial, range, LAMBDA(acc, x, body)) → HF委譲
function _jsReduceCompute(sheet, initial, rangeStr, lambdaFormula) {
  if(!hf) return null;
  var mL=lambdaFormula.match(/^LAMBDA\s*\(([^,)]+)\s*,\s*([^,)]+)\s*,\s*(.+)\)$/is);
  if(!mL) return '#VALUE!';
  var p1=mL[1].trim(),p2=mL[2].trim(),body=mL[3].trim();
  var m=rangeStr.match(/^([A-Z]+\d+):([A-Z]+\d+)$/i); if(!m) return '#VALUE!';
  var s=_toRC(m[1]),e=_toRC(m[2]),acc=initial;
  for(var r=s.r;r<=e.r;r++){for(var c=s.c;c<=e.c;c++){
    var v=hf.getCellValue({sheet:_hfSid(sheet),row:r,col:c});
    var expr=body.replace(new RegExp('\\b'+p1+'\\b','g'),'('+acc+')').replace(new RegExp('\\b'+p2+'\\b','g'),'('+v+')');
    hf.setCellContents({sheet:_hfSid(sheet),row:9998,col:0},'='+expr);

    if(typeof res==='number') acc=res;

}

// ================================================================
// convertFormula: 文字列変換
// ================================================================
function convertFormula(f) {
  if(!f||f[0]!=='=') return f;
  // LET展開
  if(/^=LET\s*\(/i.test(f)) f = _jsLetExpand(f);
  // LAMBDA即時呼び出し展開
  if(/^=LAMBDA\s*\(/i.test(f)) f = _jsLambdaExpand(f);
  f = f.replace(/\bFALSE\b(?!\s*\()/g, 'FALSE()');
  f = f.replace(/\bTRUE\b(?!\s*\()/g, 'TRUE()');
  f = f.replace(/\bNORMSDIST\s*\(([^,)]+)\)/gi, 'NORMSDIST($1,TRUE())');
  f = f.replace(/\bBETADIST\s*\(([^,()]+,[^,()]+,[^,()]+)\)/gi, 'BETA.DIST($1,TRUE())');
  f = f.replace(/\bHYPGEOMDIST\s*\(([^()]+)\)/gi, function(m,args){return args.split(',').length===4?'HYPGEOMDIST('+args+',FALSE())':m;});
  f = f.replace(/\bNEGBINOMDIST\s*\(([^()]+)\)/gi, function(m,args){return args.split(',').length===3?'NEGBINOMDIST('+args+',FALSE())':m;});
  f = f.replace(/\bISREF\s*\(([^)]+)\)/gi, function(m,arg){return /^[A-Z]+\d+(:[A-Z]+\d+)?$/i.test(arg.trim())?'TRUE()':'FALSE()';});
  return f;
}

// HFに渡す値の型変換（文字列の数値→number、空→null）
function toHFVal(v){
  if(v===''||v===null||v===undefined) return null;
  if(typeof v==='string'&&v[0]==='=') return v; // 数式はそのまま
  if(typeof v==='string'&&v.trim()!==''&&!isNaN(v)) return parseFloat(v); // 数値文字列→number
  return v;
}
function setCellFormula(sheet, r, c, v) {
  if(!hf) return null;
  try {
    var jsResult = _jsComputeFormula(sheet, v);
    if(jsResult !== null) {
      hf.setCellContents({sheet:_hfSid(sheet),row:r,col:c}, toHFVal(v));
      return jsResult;
    }
    var converted = (v&&v[0]==='=') ? convertFormula(v) : v;
    hf.setCellContents({sheet:_hfSid(sheet),row:r,col:c}, toHFVal(converted));
    var hfDisp = _hfGetDisplay(sheet, r, c);
    // HFがエラーを返した場合はJS evalFormulaで再試行
    if(hfDisp && typeof hfDisp==='string' && hfDisp[0]==='#' && v && v[0]==='='){
      var jsRetry = evalFormula(v, r, c);
      if(jsRetry !== v && jsRetry !== '#ERR' && String(jsRetry)[0]!=='#') return String(jsRetry);
    }
    return hfDisp;
  } catch(e) { return null; }
}
function undoCellFormula(sheet, r, c, v) { return setCellFormula(sheet, r, c, v); }
function recalcSheet(sheetIdx, data) {
  if(!hf) return;
  var keys = Object.keys(data);
  for(var i=0;i<keys.length;i++){
    var cell = data[keys[i]];
    if(cell.f && cell.f[0]==='='){
      var parts = keys[i].split(',');
      var r=parseInt(parts[0]),c=parseInt(parts[1]);
      var jsResult = _jsComputeFormula(sheetIdx, cell.f);
      cell.d = jsResult!==null ? jsResult : _hfGetDisplay(sheetIdx, r, c);
    }
  }
}

function colorizeFormula(text){

  var reIF=new RegExp('=IF'+lp+'([^,，]+)'+cm+'([^,，]+)'+cm+'([^)）]+)'+rp,'gi');
  text=text.replace(reIF,function(m,a1,a2,a3){return '=IF(<span class="arg-blue">'+a1.trim()+'</span>, <span class="arg-orange">'+a2.trim()+'</span>, <span class="arg-purple">'+a3.trim()+'</span>)';});

  var b='\uD83D\uDD35',o='\uD83D\uDFE0',p='\uD83D\uDFE3',g='\uD83D\uDFE2';
  text=text.replace(new RegExp(b+'\\s*\\*\\*([^*]+)\\*\\*','g'),b+' <span class="arg-blue">$1</span>');

function colorizeFormulaBlock(f){

  f=f.replace(/COUNTIF\s*\(([^,()]+),\s*([^,()]+)\)/gi,function(m,a1,a2){return 'COUNTIF(<span class="arg-blue">'+a1.trim()+'</span>, <span class="arg-orange">'+a2.trim()+'</span>)';});
  f=f.replace(/(?<![A-Z])IF\s*\(([^,()]+),\s*([^,()]+),\s*([^,()]+)\)/gi,function(m,a1,a2,a3){return 'IF(<span class="arg-blue">'+a1.trim()+'</span>, <span class="arg-orange">'+a2.trim()+'</span>, <span class="arg-purple">'+a3.trim()+'</span>)';});

function formatAIText(text){
  var blocks = [];
  text = text.replace(/```[\w]*\n?([\s\S]*?)```/g, function(m,c){
    var raw = c.trim();
    var colored = colorizeFormulaBlock(raw);
    blocks.push({colored:colored, raw:raw});
    return '\x00BLOCK'+(blocks.length-1)+'\x00';
  });
  text = colorizeFormula(text);
  text = text.replace(/`([^`]+)`/g,'<span class="inline-code">$1</span>');
  text = text.replace(/\n/g,'<br>');
  text = text.replace(/\x00BLOCK(\d+)\x00/g, function(m,idx){
    var b = blocks[parseInt(idx)];
    var safeRaw = b.raw.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return '<div class="formula-block">'+b.colored+'</div>'
      +'<button class="copy-btn" onclick="copyText(this,\''+safeRaw+'\')">📋 数式をコピー</button>';
  });

function extractWriteAction(text){
  var idx = text.indexOf('"action"');
  if(idx === -1) return null;
  var start = text.lastIndexOf('{', idx);
  if(start === -1) return null;
  var depth = 0;
  for(var i = start; i < text.length; i++){
    if(text[i] === '{') depth++;
    else if(text[i] === '}'){
      depth--;
      if(depth === 0){
        try {
          var json = JSON.parse(text.substring(start, i+1));
          if(json.action === 'write') return { json:json, start:start, end:i+1 };
        } catch(e) { return null; }
      }
    }
  }
  return null;
}

// 数値フォーマット適用
function applyNumFmt(val, fmt) {
  var n = parseFloat(val);
  if(isNaN(n)) return val;
  if(fmt==='#,##0')    return Math.round(n).toLocaleString('ja-JP');
  if(fmt==='#,##0.00') return n.toLocaleString('ja-JP',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(fmt==='0%')       return Math.round(n*100)+'%';
  if(fmt==='0.00%')    return (n*100).toFixed(2)+'%';
  if(fmt==='¥#,##0')   return '¥'+Math.round(n).toLocaleString('ja-JP');
  if(fmt==='0.00')     return n.toFixed(2);
  if(fmt==='YYYY/MM/DD'){
    var d=new Date(Math.round((n-25569)*86400*1000));
    return d.getFullYear()+'/'
      +String(d.getMonth()+1).padStart(2,'0')+'/'
      +String(d.getDate()).padStart(2,'0');
  }
  return val;
}

function _debounce(fn,ms){var t;return function(){var a=arguments,s=this;clearTimeout(t);t=setTimeout(function(){fn.apply(s,a);},ms);};}
function _throttle(fn,ms){var last=0;return function(){var now=Date.now();if(now-last>=ms){last=now;fn.apply(this,arguments);}};}

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,wrapW,wrapH);

  var sC=xToC(HDR_W), sR=yToR(HDR_H), eC=sC, eR=sR;
  while(colX(eC)<wrapW && eC<COLS-1) eC++;
  while(rowY(eR)<wrapH && eR<ROWS-1) eR++;

  // 1. 全体白背景（高速）
  ctx.fillStyle=C_CELL_BG;
  ctx.fillRect(HDR_W,HDR_H,wrapW,wrapH);

  // 2. bgColorあるセルを上塗り
  for(var r=sR;r<=eR+1;r++) for(var c=sC;c<=eC+1;c++){
    var cell=getCell(r,c);
    if(!cell.bgColor) continue;
    var cx=colX(c),cy=rowY(r),cw=cW(c),ch=rH(r);
    if(cx+cw<HDR_W||cx>wrapW||cy+ch<HDR_H||cy>wrapH) continue;
    ctx.fillStyle=cell.bgColor;
    ctx.fillRect(cx,cy,cw,ch);
  }

  // 3. 選択セル背景（半透明: bgColorが透けて見える）
  ctx.fillStyle='rgba(30,136,229,0.18)';
  for(var r=Math.max(sR,selR1);r<=Math.min(eR+1,selR2);r++)
    for(var c=Math.max(sC,selC1);c<=Math.min(eC+1,selC2);c++)
      ctx.fillRect(colX(c),rowY(r),cW(c),rH(r));

  // 2. グリッド線
  ctx.strokeStyle=C_CELL_LINE; ctx.lineWidth=0.5; ctx.beginPath();
  for(var r=sR;r<=eR+2;r++){
    var ly=Math.round(rowY(r))+0.5; if(ly<=HDR_H||ly>wrapH) continue;
    ctx.moveTo(HDR_W,ly); ctx.lineTo(wrapW,ly);
  }
  for(var c=sC;c<=eC+2;c++){
    var lx=Math.round(colX(c))+0.5; if(lx<=HDR_W||lx>wrapW) continue;
    ctx.moveTo(lx,HDR_H); ctx.lineTo(lx,wrapH);
  }
  ctx.stroke();

  // 3. セルテキスト
  for(var r=sR;r<=eR+1;r++) for(var c=sC;c<=eC+1;c++) drawText(r,c);

  // 4. 罫線（グリッド線の上に描画）
  for(var r=sR;r<=eR+1;r++) for(var c=sC;c<=eC+1;c++) drawBorder(r,c);

  // 5. ヘッダー背景
  ctx.fillStyle=C_HDR_BG;
  ctx.fillRect(0,0,wrapW,HDR_H);
  ctx.fillRect(0,0,HDR_W,wrapH);

  // 6. 選択ヘッダー強調
  ctx.fillStyle=C_SEL_HDR;
  for(var c=selC1;c<=selC2;c++) ctx.fillRect(colX(c),0,cW(c),HDR_H);
  for(var r=selR1;r<=selR2;r++) ctx.fillRect(0,rowY(r),HDR_W,rH(r));

  // 7. ヘッダー線
  ctx.strokeStyle=C_HDR_LINE; ctx.lineWidth=0.5; ctx.beginPath();
  for(var c=sC;c<=eC+2;c++){
    var lx=Math.round(colX(c))+0.5; if(lx<=HDR_W||lx>wrapW) continue;
    ctx.moveTo(lx,0); ctx.lineTo(lx,HDR_H);
  }
  for(var r=sR;r<=eR+2;r++){
    var ly=Math.round(rowY(r))+0.5; if(ly<=HDR_H||ly>wrapH) continue;
    ctx.moveTo(0,ly); ctx.lineTo(HDR_W,ly);
  }
  ctx.moveTo(HDR_W+0.5,0); ctx.lineTo(HDR_W+0.5,wrapH);
  ctx.moveTo(0,HDR_H+0.5); ctx.lineTo(wrapW,HDR_H+0.5);
  ctx.stroke();
  var lastColX=Math.round(colX(COLS))+0.5, lastRowY=Math.round(rowY(ROWS))+0.5;
  ctx.strokeStyle='#3D9E72'; ctx.lineWidth=1.5; ctx.beginPath();
  if(lastColX>HDR_W&&lastColX<=wrapW){ ctx.moveTo(lastColX,0); ctx.lineTo(lastColX,wrapH); }
  if(lastRowY>HDR_H&&lastRowY<=wrapH){ ctx.moveTo(0,lastRowY); ctx.lineTo(wrapW,lastRowY); }
  ctx.stroke();

  // 8. ヘッダーテキスト
  ctx.textBaseline='middle';
  ctx.textAlign='center';
  var fw=scale<0.75?'normal':'bold';
  var fs=Math.max(9,Math.round(11*Math.min(scale,1.5)));
  ctx.font=fw+' '+fs+'px "Noto Sans JP",sans-serif';
  for(var c=sC;c<=eC+1;c++){
    var x=colX(c),w=cW(c); if(x+w<0||x>wrapW) continue;
    ctx.fillStyle=(c>=selC1&&c<=selC2)?'#1E88E5':C_HDR_TXT;
    ctx.fillText(colLetter(c),x+w/2,HDR_H/2);
  }
  ctx.textAlign='right';
  var rf=Math.max(9,Math.round(11*Math.min(scale,1.5)));
  ctx.font=rf+'px "Noto Sans JP",sans-serif';
  for(var r=sR;r<=eR+1;r++){
    var y=rowY(r),h=rH(r); if(y+h<0||y>wrapH) continue;
    ctx.fillStyle=(r>=selR1&&r<=selR2)?'#1E88E5':C_HDR_TXT;
    ctx.fillText(r+1,HDR_W-4,y+h/2);
  }

  // 9. 左上角
  ctx.fillStyle=C_HDR_BG;
  ctx.fillRect(0,0,HDR_W,HDR_H);
  ctx.strokeStyle=C_HDR_LINE; ctx.lineWidth=0.5;
  ctx.strokeRect(0.5,0.5,HDR_W-0.5,HDR_H-0.5);

  // 9.5 列リサイズハンドル（列ヘッダー境界に細い縦線）
  ctx.strokeStyle='#7DB89A'; ctx.lineWidth=1;
  var sC2=xToC(HDR_W), eC2=xToC(wrapW);
  for(var c=sC2;c<=eC2+1;c++){
    var bx=colX(c)+cW(c);
    if(bx<=HDR_W||bx>wrapW) continue;
    var hy1=Math.round(HDR_H*0.2), hy2=Math.round(HDR_H*0.8);
    ctx.beginPath(); ctx.moveTo(bx-1,hy1); ctx.lineTo(bx-1,hy2);
    ctx.moveTo(bx+1,hy1); ctx.lineTo(bx+1,hy2); ctx.stroke();
  }
  // 9.6 行リサイズグリップ（行ヘッダー下端中央に横線）
  ctx.strokeStyle='#9EC8B0'; ctx.lineWidth=1;
  var sR2=yToR(HDR_H), eR2=yToR(wrapH);
  var gx1=Math.round(HDR_W*0.25), gx2=Math.round(HDR_W*0.75);
  for(var r=sR2;r<=eR2+1;r++){
    var gby=rowY(r)+rH(r)-1;
    if(gby<=HDR_H||gby>wrapH) continue;
    ctx.beginPath(); ctx.moveTo(gx1,gby); ctx.lineTo(gx2,gby); ctx.stroke();
  }

  // 10. 選択枠（最前面）
  drawSel();
  // 11. refMode中: 参照セルハイライト
  // 複数参照ハイライト（Excelスタイル）
  if(getRefInput()&&_currentRefs.length>0){
    _currentRefs.forEach(function(addr,i){
      var color=REF_COLORS[i%REF_COLORS.length];
      var parsed=parseAddr(addr);
      if(parsed) drawRefHighlightColor(parsed.r,parsed.c,color);
    });
  } else if(getRefInput()&&refStartR>=0){
    drawRefHighlightColor(refStartR,refStartC,REF_COLORS[0]);
  }

  // ⋮ボタン位置を更新
  if(typeof updateActionBtn==='function') updateActionBtn();
}

function drawText(r,c){
  var x=colX(c),y=rowY(r),w=cW(c),h=rH(r);
  if(x+w<HDR_W||x>wrapW||y+h<HDR_H||y>wrapH) return;
  var cell=getCell(r,c);

  // 表示値（numFmt適用）
  var raw = (cell.d!==undefined&&cell.d!=='') ? cell.d : cell.v;
  if(!raw) return;
  var display = (cell.numFmt && raw!=='') ? applyNumFmt(raw, cell.numFmt) : raw;

  // フォント
  var fontSize = Math.max(9, Math.min(72, Math.round((cell.fontSize||12)*scale)));
  var weight = cell.bold ? 'bold' : 'normal';
  var style  = cell.italic ? 'italic' : 'normal';
  ctx.font = style+' '+weight+' '+fontSize+'px "Noto Sans JP",sans-serif';

  // 文字色
  var isFormula = cell.f && cell.f[0]==='=';
  var showRaw = isFormula && cell.d===cell.f;
  ctx.fillStyle = showRaw ? C_FORMULA : (cell.color||C_CELL_TXT);

  // 文字揃え
  var align = cell.align||'left';
  // 数値・日付は右寄せデフォルト（書式が明示されていない場合）
  if(!cell.align && typeof parseFloat(raw)==='number' && !isNaN(parseFloat(raw)) && raw!=='') align='right';

  ctx.textBaseline='middle';
  ctx.save();
  ctx.rect(x+1,y,w-2,h); ctx.clip();

  var tx;
  if(align==='center') { ctx.textAlign='center'; tx=x+w/2; }
  else if(align==='right') { ctx.textAlign='right'; tx=x+w-4; }
  else { ctx.textAlign='left'; tx=x+4; }

  ctx.fillText(display, tx, y+h/2);

  // 下線・取り消し線
  if(cell.underline||cell.strike){
    var metrics = ctx.measureText(display);
    var ux = align==='center' ? x+w/2-metrics.width/2 :
             align==='right'  ? x+w-4-metrics.width : x+4;
    ctx.strokeStyle = cell.color||C_CELL_TXT;
    ctx.lineWidth = 1;
    if(cell.underline){
      ctx.beginPath();
      ctx.moveTo(ux, y+h/2+fontSize*0.6);
      ctx.lineTo(ux+metrics.width, y+h/2+fontSize*0.6);
      ctx.stroke();
    }
    if(cell.strike){
      ctx.beginPath();
      ctx.moveTo(ux, y+h/2);
      ctx.lineTo(ux+metrics.width, y+h/2);
      ctx.stroke();
    }
  }

  ctx.restore();
}

// 罫線描画（最適化版：border持つセルのみ処理・二重線防止）
function drawBorder(r,c){
  var cell=getCell(r,c);
  if(!cell.border) return; // borderなし → 即return（最適化）
  var b=cell.border;
  var x=colX(c),y=rowY(r),w=cW(c),h=rH(r);
  if(x+w<HDR_W||x>wrapW||y+h<HDR_H||y>wrapH) return;
  ctx.save();
  if(b.top){
    ctx.strokeStyle=b.top===2?'#1A2B22':'#888888';
    ctx.lineWidth=b.top===2?2:1;
    ctx.beginPath(); ctx.moveTo(x,y+0.5); ctx.lineTo(x+w,y+0.5); ctx.stroke();
  }
  if(b.left){
    ctx.strokeStyle=b.left===2?'#1A2B22':'#888888';
    ctx.lineWidth=b.left===2?2:1;
    ctx.beginPath(); ctx.moveTo(x+0.5,y); ctx.lineTo(x+0.5,y+h); ctx.stroke();
  }
  if(b.bottom){
    var nxtB=getCell(r+1,c);
    if(!nxtB.border||!nxtB.border.top){
      ctx.strokeStyle=b.bottom===2?'#1A2B22':'#888888';
      ctx.lineWidth=b.bottom===2?2:1;
      ctx.beginPath(); ctx.moveTo(x,y+h-0.5); ctx.lineTo(x+w,y+h-0.5); ctx.stroke();
    }
  }
  if(b.right){
    var nxtR=getCell(r,c+1);
    if(!nxtR.border||!nxtR.border.left){
      ctx.strokeStyle=b.right===2?'#1A2B22':'#888888';
      ctx.lineWidth=b.right===2?2:1;
      ctx.beginPath(); ctx.moveTo(x+w-0.5,y); ctx.lineTo(x+w-0.5,y+h); ctx.stroke();
    }
  }
  ctx.restore();
}

// ===== セル参照入力モード =====
function getRefInput(){
  // カスタムKB編集中でrefModeならformula-inputを返す
  if(_editMode&&refMode){
    var fi=document.getElementById('formula-input');
    if(fi) return fi;
  }
  // cell-input（ダブルタップ編集）
  var ci=document.getElementById('cell-input');
  if(editingCell&&ci&&ci.style.display!=='none'){
    var v=ci.value;
    if(v.length>0&&(v[0]==='='||v[0]==='＝')) return ci;
  }
  return null;
}
function extractRefs(formula){
  if(!formula||formula[0]!=='=') return [];
  var pattern=/(?<![A-Za-z])\$?[A-Za-z]{1,3}\$?[0-9]{1,7}(?![0-9A-Za-z])/g;
  var matches=formula.match(pattern);
  if(!matches) return [];
  return matches.filter(function(v,i,a){return a.indexOf(v)===i;})
    .map(function(a){return a.replace(/\$/g,'');});
}
function insertRefAddr(r1,c1,r2,c2){
  var addr=(r1===r2&&c1===c2)?cellAddr(r1,c1)
    :(cellAddr(Math.min(r1,r2),Math.min(c1,c2))+':'+cellAddr(Math.max(r1,r2),Math.max(c1,c2)));
  fkbInsert(addr);
  refStartR=r1; refStartC=c1;
}
function parseAddr(addr){
  var m=addr.match(/^([A-Za-z]{1,3})([0-9]{1,7})$/);
  if(!m) return null;
  var col=0; var s=m[1].toUpperCase();
  for(var i=0;i<s.length;i++) col=col*26+(s.charCodeAt(i)-64);
  return {r:parseInt(m[2])-1, c:col-1};
}
function drawRefHighlightColor(r,c,color){
  var x=colX(c),y=rowY(r),w=cW(c),h=rH(r);
  if(x+w<HDR_W||y+h<HDR_H) return;
  ctx.save();
  ctx.rect(HDR_W,HDR_H,wrapW-HDR_W,wrapH-HDR_H);
  ctx.clip();
  // 色付き薄塗り
  ctx.fillStyle=color.replace(')',',0.12)').replace('rgb','rgba');
  // hex色を簡易変換
  ctx.fillStyle='rgba(0,0,0,0.0)'; // 塗りなし（枠のみ）
  ctx.fillRect(x,y,w,h);
  // 色付き太枠
  ctx.strokeStyle=color;
  ctx.lineWidth=2;
  ctx.setLineDash([]);
  ctx.strokeRect(x+1,y+1,w-2,h-2);
  ctx.restore();
}
function drawRefHighlight(r,c){ drawRefHighlightColor(r,c,REF_COLORS[0]); }

function drawSel(){
  var x1=colX(selC1),y1=rowY(selR1);
  var x2=colX(selC2)+cW(selC2),y2=rowY(selR2)+rH(selR2);
  ctx.save();
  ctx.rect(HDR_W,HDR_H,wrapW-HDR_W,wrapH-HDR_H); ctx.clip();
  ctx.strokeStyle=C_SEL_BORDER; ctx.lineWidth=2;
  ctx.strokeRect(x1+1,y1+1,x2-x1-2,y2-y1-2);
  ctx.fillStyle=C_SEL_BORDER;
  ctx.beginPath(); ctx.arc(x2,y2,7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x2,y2,3.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

</script>

</head>
<body>

<div id="loading"><div class="spinner"></div><p>グリッドを起動中...</p></div>

  </div>

  </div>
</div>

<div id="ctx-menu" ontouchstart="event.stopPropagation()">
  <div class="ctx-item" onclick="explainCell()" style="color:#3D9E72;font-weight:700;">🤖 AIに解説させる</div>
  <div class="ctx-divider"></div>
  <div class="ctx-item" onclick="ctxCopy()">📋 コピー <span style="color:#aaa;font-size:11px;margin-left:auto">Ctrl+C</span></div>
  <div class="ctx-item" onclick="ctxPaste()">📌 貼り付け <span style="color:#aaa;font-size:11px;margin-left:auto">Ctrl+V</span></div>
  <div class="ctx-item" onclick="ctxDelete()">🗑️ 削除 <span style="color:#aaa;font-size:11px;margin-left:auto">Del</span></div>
  <div class="ctx-divider"></div>
  <div class="ctx-item" onclick="ctxInsertRow()">➕ 行を挿入（上）</div>
  <div class="ctx-item" onclick="ctxInsertCol()">➕ 列を挿入（左）</div>
  <div class="ctx-item" onclick="ctxDeleteRow()">🗑️ 行を削除</div>
  <div class="ctx-item" onclick="ctxDeleteCol()">🗑️ 列を削除</div>
  <div class="ctx-divider"></div>
  <div class="ctx-item" onclick="ctxHideRow()">👁️ 行を非表示</div>
  <div class="ctx-item" onclick="ctxHideCol()">👁️ 列を非表示</div>
  <div class="ctx-item" id="ctx-unhide-row" style="display:none" onclick="ctxUnhideRow()">👁️ 行を再表示</div>
  <div class="ctx-item" id="ctx-unhide-col" style="display:none" onclick="ctxUnhideCol()">👁️ 列を再表示</div>
</div>

<div id="header">
  <div style="display:flex;align-items:center;gap:6px;">
    <span style="font-size:16px;">⚡</span>
    <span style="font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:#fff;letter-spacing:-0.5px;">Exally</span>
  </div>
</div>

<div id="formula-bar">
  <input id="cell-addr" type="text" value="A1" readonly>

  <button class="undo-btn" onclick="doUndo()" title="元に戻す">↩</button>
  <button class="undo-btn" onclick="doRedo()" title="やり直す">↪</button>
  <div id="ref-chip-bar" style="display:none;padding:2px 8px;background:#FFF8E1;border-bottom:1px solid #FFE0B2;font-size:12px;font-family:'Noto Sans JP',sans-serif;color:#E65100;"></div>
</div>

<!-- 色付き数式表示行（カスタムKBモード+数式入力時のみ表示） -->

<div id="formula-color-bar" style="display:none;padding:2px 8px;background:#fff;border-bottom:1px solid #E8F5EE;font-size:15px;font-family:'DM Mono',monospace;line-height:24px;white-space:nowrap;overflow-x:auto;"></div>

<!-- カスタムキーボード（formula編集モード時に表示） -->

<div id="formula-kb" style="display:none;background:#F0FAF4;border-top:1px solid #C8ECD8;">
  <!-- タブ -->
  <div style="display:flex;border-bottom:1px solid #C8ECD8;">
    <button id="fkb-tab-num" onclick="fkbTab('num')" style="flex:1;padding:6px 0;font-size:13px;font-weight:700;border:none;background:#52B788;color:#fff;cursor:pointer;">123</button>
    <button id="fkb-tab-abc" onclick="fkbTab('abc')" style="flex:1;padding:6px 0;font-size:13px;border:none;background:#E8F5EE;color:#3D9E72;cursor:pointer;">ABC</button>
    <button id="fkb-tab-sym" onclick="fkbTab('sym')" style="flex:1;padding:6px 0;font-size:13px;border:none;background:#E8F5EE;color:#3D9E72;cursor:pointer;">記号</button>
  </div>
  <!-- 数字・演算子 (2行11等分) -->
  <div id="fkb-panel-num" style="padding:6px 4px;">
    <div style="display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin-bottom:3px;">
      <button class="fkb-btn fkb-op" onclick="fkbInsert('=')" style="max-width:none;"><b>=</b></button>
      <button class="fkb-btn fkb-op" onclick="fkbInsert('+')" style="max-width:none;">+</button>
      <button class="fkb-btn fkb-op" onclick="fkbInsert('-')" style="max-width:none;">−</button>
      <button class="fkb-btn fkb-op" onclick="fkbInsert('*')" style="max-width:none;">×</button>

      <button class="fkb-btn fkb-op" onclick="fkbInsert('(')" style="max-width:none;">(</button>
      <button class="fkb-btn fkb-op" onclick="fkbInsert(')')" style="max-width:none;">)</button>
      <button class="fkb-btn fkb-op" onclick="fkbInsert(':')" style="max-width:none;">:</button>
      <button class="fkb-btn fkb-op" onclick="fkbInsert(',')" style="max-width:none;">,</button>
      <button class="fkb-btn fkb-op" onclick="fkbInsert('.')" style="max-width:none;">.</button>
      <button class="fkb-btn fkb-del" onclick="fkbDelete()" style="max-width:none;">⌫</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(9,1fr) 1fr 1fr;gap:3px;">
      <button class="fkb-btn" onclick="fkbInsert('1')" style="max-width:none;">1</button>
      <button class="fkb-btn" onclick="fkbInsert('2')" style="max-width:none;">2</button>
      <button class="fkb-btn" onclick="fkbInsert('3')" style="max-width:none;">3</button>
      <button class="fkb-btn" onclick="fkbInsert('4')" style="max-width:none;">4</button>
      <button class="fkb-btn" onclick="fkbInsert('5')" style="max-width:none;">5</button>
      <button class="fkb-btn" onclick="fkbInsert('6')" style="max-width:none;">6</button>
      <button class="fkb-btn" onclick="fkbInsert('7')" style="max-width:none;">7</button>
      <button class="fkb-btn" onclick="fkbInsert('8')" style="max-width:none;">8</button>
      <button class="fkb-btn" onclick="fkbInsert('9')" style="max-width:none;">9</button>
      <button class="fkb-btn" onclick="fkbInsert('0')" style="max-width:none;">0</button>
      <button class="fkb-btn fkb-commit" onclick="fkbCommit()" style="max-width:none;background:#52B788;color:#fff;font-weight:700;">✓</button>
    </div>
  </div>
  <!-- アルファベット -->
  <div id="fkb-panel-abc" style="display:none;padding:6px 4px;">

<script>
// ===== 定数 =====
var ROW_H = 22, COL_W = 80, HDR_W = 46, HDR_H = 22, ROWS = 1048576, COLS = 16384;

// カラー
var C_HDR_BG     = '#F0FAF4';
var C_HDR_TXT    = '#4A6B5A';
var C_HDR_LINE   = '#C8D8D0';
var C_CELL_BG    = '#ffffff';
var C_CELL_LINE  = '#D8E8E0';
var C_SEL_BG     = '#E3F2FD';
var C_SEL_HDR    = '#BBDEFB';
var C_SEL_BORDER = '#1E88E5';
var C_CELL_TXT   = '#1A2B22';
var C_FORMULA    = '#1565C0';

// ===== 状態 =====
var sheets = [
  { name:'Sheet1', data:{}, colW:{}, rowH:{}, hiddenRows:{}, hiddenCols:{} },
  { name:'Sheet2', data:{}, colW:{}, rowH:{}, hiddenRows:{}, hiddenCols:{} }
];
var activeSheet = 0;
var selR1=0, selC1=0, selR2=0, selC2=0;
var scrollTop=0, scrollLeft=0;
var initialInnerHeight = window.innerHeight; // キーボード出現前のinnerHeightを保存
var scale=1;
var canvas, ctx, wrap, wrapW, wrapH, dpr=1;
var editingCell=null;
var refMode=false; // セル参照入力モード
var REF_COLORS=['#1E88E5','#E53935','#8E24AA','#00897B','#F4511E'];
var _currentRefs=[];
function extractRefs(formula){
  if(!formula||formula[0]!=='=') return [];
  var matches=formula.match(/(?<![A-Za-z])\$?[A-Za-z]{1,3}\$?[0-9]{1,7}(?![0-9A-Za-z])/g);
  if(!matches) return [];
  return matches.filter(function(v,i,a){return a.indexOf(v)===i;})
    .map(function(a){return a.replace(/\$/g,'');});
}
function buildDisplayHtml(formula){
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  if(!formula||formula[0]!=='=') return esc(formula);
  var refs=extractRefs(formula);
  var html=esc(formula);
  refs.forEach(function(addr,i){
    var c=REF_COLORS[i%REF_COLORS.length];
    html=html.replace(new RegExp('(?<![A-Za-z])'+addr+'(?![0-9A-Za-z])','g'),
      '<span style="color:'+c+';font-weight:700">'+addr+'</span>');
  });
  return html;
}
function updateFormulaDisplay(formula){
  _currentRefs=extractRefs(formula);
  var bar=document.getElementById('formula-color-bar');
  if(!bar) return;
  var kb=document.getElementById('formula-kb');
  var isCustomKB=kb&&kb.style.display==='block';
  if(isCustomKB&&formula&&(formula[0]==='='||formula[0]==='＝')){
    bar.innerHTML=buildDisplayHtml(formula);
    bar.style.display='block';
    _canvasBCRDirty=true;
  } else {
    bar.style.display='none';
    if(bar.style.display==='none') _canvasBCRDirty=true;
  }
} // 現在の数式の参照セルリスト
var refStartR=-1, refStartC=-1;
var _editMode=false;    // カスタムKB表示中
var _fiCursorPos=0;     // formula-inputのカーソル位置
var touchState=null;

// ===== 初期化 =====
window.addEventListener('resize', function(){
  initialInnerHeight = window.innerHeight; // リサイズ時は更新
  dpr = window.devicePixelRatio || 1; resize(); render();
});
window.addEventListener('load', function() {
  try {
    canvas = document.getElementById('grid-canvas');
    ctx = canvas.getContext('2d');
    wrap = document.getElementById('grid-wrap');
    dpr = window.devicePixelRatio || 1;
    resize();
    if(typeof render === 'function') render();
    bindEvents();
    initPopupDrag(); initPopupResize();
    canvas.focus();
    if(typeof initFormulaEngine === 'function'){
      initFormulaEngine(sheets.map(function(s){return s.name;}));
    }
  } catch(e) {
    console.error('Exally init error:', e);
  }
  // エラーが起きても必ずスピナーを消す
  document.getElementById('loading').classList.add('hide');
  if(typeof render === 'function') render();
  if (window.visualViewport) {
    var _throttledVP=_throttle(onVisualVP,100);
    window.visualViewport.addEventListener('resize', _throttledVP);
    window.visualViewport.addEventListener('scroll', _throttledVP);
  }
  setTimeout(function(){ scrollTop=0; scrollLeft=0; scale=1; resize(); if(typeof render==='function') render(); }, 150);
});
function resize() {
  _canvasBCRDirty=true; // BCRキャッシュを無効化
  dpr = window.devicePixelRatio || 1;
  wrapW = wrap.clientWidth; wrapH = wrap.clientHeight;
  canvas.width  = Math.round(wrapW * dpr);
  canvas.height = Math.round(wrapH * dpr);
  canvas.style.width  = wrapW + 'px';
  canvas.style.height = wrapH + 'px';

}

// ===== データ =====
function getCell(r,c){ return sheets[activeSheet].data[r+','+c] || {v:'',f:'',d:''}; }
var undoStack = [], redoStack = [];
function setCell(r,c,v,noUndo){
  // 全角→半角正規化（日本語IMEキーボード対応）
  if(v && typeof v==='string'){
    v = v.replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); });
    v = v.replace(/\u3000/g, ' ');
  }
  // 不完全数式（=のみ）は空として扱う
  if(v==='=') v='';
  var key = r+','+c;
  var prev = sheets[activeSheet].data[key] ? sheets[activeSheet].data[key].v : '';
  if(!noUndo){ undoStack.push({sheet:activeSheet,key:key,old:prev,new_:v}); redoStack=[]; }
  var d = v;
  var hfResult = setCellFormula(activeSheet, r, c, v);
  if(hfResult !== null){ d = hfResult; }
  else if(v && v[0]==='='){ d = evalFormula(v, r, c); }
  // 既存の書式プロパティを保持してv/f/dのみ更新
  var existing = sheets[activeSheet].data[key] || {};
  sheets[activeSheet].data[key] = Object.assign({}, existing, {v:v, f:v, d:String(d)});
  // 依存セルの再計算（数値変更→数式セルに即反映）
  if(hfResult !== null){
    var _s=activeSheet, _d=sheets[activeSheet].data;
    _scheduleRecalc(_s,_d);
  }
}
function doUndo(){
  if(!undoStack.length) return;
  var op = undoStack.pop();
  redoStack.push({type:op.type, snap:op.type==='rowcol'?JSON.parse(JSON.stringify(sheets[activeSheet])):op.snap, kind:op.kind, sheet:op.sheet, idx:op.idx, old:op.old, nw:op.nw, key:op.key, new_:op.new_});
  // 行列操作Undo（スナップショット復元）
  if(op.type==='rowcol'){
    sheets[activeSheet]=op.snap; render(); updateBar(); return;
  }
  // リサイズUndo
  if(op.type==='resize'){
    if(op.kind==='col') sheets[op.sheet].colW[op.idx]=op.old;
    else sheets[op.sheet].rowH[op.idx]=op.old;
    render(); return;
  }
  // 書式Undo
  if(op.type==='format'){
    op.snap.forEach(function(s){
      if(!sheets[activeSheet].data[s.key]) sheets[activeSheet].data[s.key]={v:'',f:'',d:''};
      if(s.old===undefined) delete sheets[activeSheet].data[s.key][s.prop];
      else sheets[activeSheet].data[s.key][s.prop]=s.old;
    });
    render(); updateBar(); return;
  }
  // 値Undo（既存）
  var parts = op.key.split(',');
  var r = parseInt(parts[0]), c = parseInt(parts[1]);
  var d = op.old;
  var hfResult = undoCellFormula(op.sheet, r, c, op.old);
  if(hfResult !== null){ d = hfResult; }
  else if(d && d[0]==='='){ d = evalFormula(d, r, c); }
  // 書式プロパティを保持しつつ値のみ戻す
  var existing = sheets[op.sheet].data[op.key] || {};
  if(!op.old) {
    // 書式があれば書式は残す
    var hasFmt = existing.bold||existing.italic||existing.underline||existing.color||existing.bgColor||existing.border||existing.numFmt||existing.align||existing.fontSize;
    if(hasFmt) { existing.v=op.old||''; existing.f=op.old||''; existing.d=''; }
    else delete sheets[op.sheet].data[op.key];
  } else {
    sheets[op.sheet].data[op.key] = Object.assign({}, existing, {v:op.old, f:op.old, d:String(d||'')});
  }
  render(); updateBar();
}
function doRedo(){
  if(!redoStack.length) return;
  var op = redoStack.pop();
  undoStack.push(op);
  // 行列操作Redo
  if(op.type==='rowcol'){
    sheets[activeSheet]=op.snap; render(); updateBar(); return;
  }
  // リサイズRedo
  if(op.type==='resize'){
    if(op.kind==='col') sheets[op.sheet].colW[op.idx]=op.nw;
    else sheets[op.sheet].rowH[op.idx]=op.nw;
    render(); return;
  }
  if(op.type==='format'){
    op.snap.forEach(function(s){
      if(!sheets[activeSheet].data[s.key]) sheets[activeSheet].data[s.key]={v:'',f:'',d:''};
      if(s.nw===undefined) delete sheets[activeSheet].data[s.key][s.prop];
      else sheets[activeSheet].data[s.key][s.prop]=s.nw;
    });
    render(); updateBar(); return;
  }
  var parts = op.key.split(',');
  setCell(parseInt(parts[0]), parseInt(parts[1]), op.new_, true);
  render(); updateBar();
}

// A1形式 → {r,c}
function addrToRC(addr){
  var m = addr.match(/^([A-Z]+)(\d+)$/i);
  if(!m) return null;
  var col=0; for(var i=0;i<m[1].length;i++) col=col*26+(m[1].toUpperCase().charCodeAt(i)-64);
  return {r:parseInt(m[2])-1, c:col-1};
}

// セルの数値を取得
function getCellNum(r,c){
  var cell = getCell(r,c);
  var v = cell.d || cell.v;
  return parseFloat(v) || 0;
}

// 簡易計算エンジン
function evalFormula(formula, selfR, selfC){
  try {
    var expr = formula.substring(1).trim();

    // SUM(A1:C1) / AVERAGE(A1:C1)
    var rangeFunc = expr.match(/^(SUM|AVERAGE|COUNT|MAX|MIN)\(([A-Z]+\d+):([A-Z]+\d+)\)$/i);
    if(rangeFunc){
      var fn = rangeFunc[1].toUpperCase();
      var rc1 = addrToRC(rangeFunc[2]);
      var rc2 = addrToRC(rangeFunc[3]);
      if(!rc1||!rc2) return formula;
      var vals=[];
      for(var r=Math.min(rc1.r,rc2.r);r<=Math.max(rc1.r,rc2.r);r++)
        for(var c=Math.min(rc1.c,rc2.c);c<=Math.max(rc1.c,rc2.c);c++)
          vals.push(getCellNum(r,c));
      if(fn==='SUM') return vals.reduce(function(a,b){return a+b;},0);
      if(fn==='AVERAGE') return vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : 0;
      if(fn==='COUNT') return vals.filter(function(v){return v!==0||getCell(r,c).v!=='';}).length;
      if(fn==='MAX') return Math.max.apply(null,vals);
      if(fn==='MIN') return Math.min.apply(null,vals);
    }

    // セル参照を数値に置換して評価（例：=A1+B1*C1）
    expr = expr.replace(/([A-Z]+\d+)/gi, function(addr){
      var rc = addrToRC(addr);
      if(!rc) return 0;
      // 循環参照防止
      if(rc.r===selfR && rc.c===selfC) return 0;
      return getCellNum(rc.r, rc.c);
    });

    // 数値式のみ評価（安全のためnumberのみ）
    if(/^[\d\s\.\+\-\*\/\(\)]+$/.test(expr)){
      var result = Function('"use strict";return ('+expr+')')();
      return isNaN(result) ? formula : Math.round(result*10000)/10000;
    }

    return formula;
  } catch(e) {
    return '#ERR';
  }
}
function cW(c){ if(sheets[activeSheet].hiddenCols&&sheets[activeSheet].hiddenCols[c]) return 0; return (sheets[activeSheet].colW[c] || COL_W) * scale; }
function rH(r){ if(sheets[activeSheet].hiddenRows&&sheets[activeSheet].hiddenRows[r]) return 0; return (sheets[activeSheet].rowH[r] || ROW_H) * scale; }

// ===== 座標 =====
function colX(c){
  var x = HDR_W - scrollLeft + c * COL_W * scale;
  var cw = sheets[activeSheet].colW;
  for(var k in cw){ if(parseInt(k) < c) x += (cw[k] - COL_W) * scale; }
  return Math.round(x);
}
function rowY(r){
  var y = HDR_H - scrollTop + r * ROW_H * scale;
  var rh = sheets[activeSheet].rowH;
  for(var k in rh){ if(parseInt(k) < r) y += (rh[k] - ROW_H) * scale; }
  return Math.round(y);
}
function xToC(x){
  var px = x - HDR_W + scrollLeft;
  if(px < 0) return 0;
  var cw = sheets[activeSheet].colW;
  if(!Object.keys(cw).length){ return Math.min(Math.floor(px / (COL_W * scale)), COLS-1); }
  var est = Math.max(0, Math.floor(px / (COL_W * scale)) - 5);
  var cx = colX(est);
  for(var c = est; c < COLS; c++){
    var w = cW(c);
    if(x >= cx && x < cx + w) return c;
    if(cx > x) return Math.max(0, c - 1);
    cx += w;
  }
  return COLS - 1;
}
function yToR(y){
  var py = y - HDR_H + scrollTop;
  if(py < 0) return 0;
  var rh = sheets[activeSheet].rowH;
  if(!Object.keys(rh).length){ return Math.min(Math.floor(py / (ROW_H * scale)), ROWS-1); }
  var est = Math.max(0, Math.floor(py / (ROW_H * scale)) - 5);
  var ry = rowY(est);
  for(var r = est; r < ROWS; r++){
    var h = rH(r);
    if(y >= ry && y < ry + h) return r;
    if(ry > y) return Math.max(0, r - 1);
    ry += h;
  }
  return ROWS - 1;
}

// ===== ユーティリティ =====
var anchorR=0, anchorC=0;
var activeR=0, activeC=0; // Shift選択の移動端

function sel(r1,c1,r2,c2){
  selR1=Math.min(r1,r2); selC1=Math.min(c1,c2);
  selR2=Math.max(r1,r2); selC2=Math.max(c1,c2);
  // 通常選択ではアンカーを更新
  anchorR=r1; anchorC=c1;
  activeR=r2; activeC=c2;
  scrollToCell(selR1,selC1); updateBar(); render();
}

// Shift拡張専用（アンカーを動かさずactiveだけ動かす）
function selShift(ar,ac){
  activeR=Math.max(0,Math.min(ROWS-1,ar));
  activeC=Math.max(0,Math.min(COLS-1,ac));
  selR1=Math.min(anchorR,activeR); selC1=Math.min(anchorC,activeC);
  selR2=Math.max(anchorR,activeR); selC2=Math.max(anchorC,activeC);
  scrollToCell(activeR,activeC); updateBar(); render();
}

// ===== スクロール =====
function scrollToCell(r,c){
  var x=colX(c),y=rowY(r),w=cW(c),h=rH(r);
  if(x<HDR_W) scrollLeft=Math.max(0,scrollLeft-(HDR_W-x));
  if(x+w>wrapW) scrollLeft+=(x+w-wrapW)+4;
  if(y<HDR_H) scrollTop=Math.max(0,scrollTop-(HDR_H-y));
  if(y+h>wrapH) scrollTop+=(y+h-wrapH)+4;
}

// ===== イベント =====
function bindEvents(){
  // マウス
  canvas.addEventListener('mousedown',onMD);
  canvas.addEventListener('mousemove',onMM);
  document.addEventListener('mouseup',function(){
    if(!touchState) return;
    if(touchState.type==='colresize'){
      var nw=Math.max(10,Math.round(sheets[activeSheet].colW[touchState.col]||COL_W));
      sheets[activeSheet].colW[touchState.col]=touchState.origW; // 一旦戻す
      setColW(touchState.col, nw); // undo付きで確定
      canvas.style.cursor='default';
    } else if(touchState.type==='rowresize'){
      var nh=Math.max(15,Math.round(sheets[activeSheet].rowH[touchState.row]||ROW_H));
      sheets[activeSheet].rowH[touchState.row]=touchState.origH;
      setRowH(touchState.row, nh);
      canvas.style.cursor='default';
    }
    if(touchState.type==='mrefsel'){ var el2=getRefInput(); if(el2) el2.focus(); touchState=null; render(); return; }
    if(touchState.type==='msel'||touchState.type==='colresize'||touchState.type==='rowresize') touchState=null;
  });
  canvas.addEventListener('dblclick',function(e){
    var p=cPos(e); if(p.x>HDR_W&&p.y>HDR_H) startEdit(selR1,selC1);
  });
  // 右クリック
  canvas.addEventListener('contextmenu',function(e){
    e.preventDefault();
    showCtxMenu(e.clientX,e.clientY);
  });
  document.addEventListener('click',function(){ hideCtxMenu(); });
  document.addEventListener('touchstart',function(e){
    var tabs = document.getElementById('sheet-tabs');
    if(tabs && tabs.contains(e.target)) return; // sheet-tabs内はスクロール優先
    hideCtxMenu();
  });
  // ホイール
  canvas.addEventListener('wheel',function(e){
    e.preventDefault();
    // deltaMode: 0=px, 1=行, 2=ページ
    var mult = e.deltaMode === 1 ? 20 : e.deltaMode === 2 ? 300 : 1;
    var dx = e.deltaX * mult;
    var dy = e.deltaY * mult;

    if(e.ctrlKey || e.metaKey){
      // Ctrl+ホイール or タッチパッドピンチ → ズーム
      var factor = dy > 0 ? 0.95 : 1.05;
      var p = cPos(e);
      var newScale = Math.max(0.5, Math.min(4, scale * factor));
      var ratio = newScale / scale;
      var cx = p.x - HDR_W;
      var cy = p.y - HDR_H;
      scrollLeft = Math.max(0, (scrollLeft + cx) * ratio - cx);
      scrollTop  = Math.max(0, (scrollTop  + cy) * ratio - cy);
      scale = newScale;
    } else {
      // 通常スクロール（マウス・タッチパッド2本指）
      scrollTop  = Math.max(0, scrollTop  + dy);
      scrollLeft = Math.max(0, scrollLeft + dx);
    }
    render();
  },{passive:false});
  // タッチ
  canvas.addEventListener('touchstart',onTS,{passive:false});
  canvas.addEventListener('touchmove',onTM,{passive:false});
  canvas.addEventListener('touchend',onTE,{passive:false});
  // キーボード
  document.addEventListener('keydown',onKD);
  // 数式バー
  var fi=document.getElementById('formula-input');
  // formula-inputイベント（iOSキーボードモード）
  fi.addEventListener('input',function(){
    var v=this.value;
    refMode=(v.length>0&&(v[0]==='='||v[0]==='＝'));
    _currentRefs=extractRefs(v);
    render();
  });
  fi.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();fkbCommit();}
    else if(e.key==='Escape'){fkbCancel();}
  });
  fi.addEventListener('focus',function(){
    fkbShow();
  });
  fi.addEventListener('blur',function(){
    // カスタムKBモードでなければ確定
    var kb=document.getElementById('formula-kb');
    if(kb.style.display==='none'||!kb.style.display){
      _editMode=false;
      var stored=getCell(selR1,selC1).f||'';
      if(this.value!==stored) setCell(selR1,selC1,this.value);
      render();
    }
  });
  // セル入力
  var ci=document.getElementById('cell-input');
  ci.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();refMode=false;refStartR=-1;commitEdit();moveSel(1,0);}
    else if(e.key==='Tab'){e.preventDefault();refMode=false;refStartR=-1;commitEdit();moveSel(0,1);}
    else if(e.key==='Escape'){refMode=false;refStartR=-1;cancelEdit();}
  });
  ci.addEventListener('input',function(){
    var v=this.value;
    refMode=(editingCell&&this.style.display!=='none'&&v.length>0&&(v[0]==='='||v[0]==='＝'));
    if(!refMode){refStartR=-1;} render();
  });
  // blur: IMEの変換中はcommitしない（compositionend後にcommit）
  var _composing = false;
  ci.addEventListener('compositionstart', function(){ _composing=true; });
  ci.addEventListener('compositionend', function(){
    _composing=false;
    render();
  });
  ci.addEventListener('blur', function(){
    if(_composing) return;
    if(refMode) return;
    setTimeout(function(){
      if(!refMode && editingCell) commitEdit();
    }, 100);
  });
  // モバイル入力欄ハンドラ
  var popupInp = document.getElementById('popup-input');
  if(popupInp){
    popupInp.addEventListener('keydown', function(e){
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendToAIMobile(); }
    });
    popupInp.addEventListener('input', function(){
      this.style.height='auto';
      this.style.height=Math.min(this.scrollHeight,80)+'px';
    });
    // touchend: preventScroll:trueでiOSのlayout viewport panningを防止
    popupInp.addEventListener('touchend', function(e){
      e.preventDefault();
      this.focus({ preventScroll: true });
    }, { passive: false });
  }
  var ai = document.getElementById('ai-input');
  ai.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      sendToAI();
    }
  });
  // iOSキーボード出現時のスクロール防止（300msでキーボード展開後にリセット）
  // iOSのpanning後にパネルを再配置（focus時にも呼ぶ）
  ai.addEventListener('touchend', function(){
    this.focus({ preventScroll: true });
  });
  ai.addEventListener('focus', function(){});
}

function cPos(e){ var r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function pDist(e){ var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY; return Math.sqrt(dx*dx+dy*dy); }

function nearHandle(x,y){
  var bx=colX(selC2)+cW(selC2),by=rowY(selR2)+rH(selR2);
  return Math.hypot(x-bx,y-by)<30;
}

// ===== 列幅・行高リサイズ =====
function getColResizeBorder(x, y, threshold){
  threshold = threshold || 4;
  if(y >= HDR_H || x < HDR_W) return -1;
  var cw = sheets[activeSheet].colW;
  var start = Object.keys(cw).length === 0
    ? Math.max(0, Math.floor((x + scrollLeft - HDR_W) / (COL_W * scale)) - 2)
    : 0;
  for(var c = start; c < COLS; c++){
    var bx = colX(c) + cW(c);
    if(bx < HDR_W - threshold) continue;
    if(bx > x + threshold + 100) break;
    if(Math.abs(x - bx) <= threshold) return c;
  }
  return -1;
}
function getRowResizeBorder(x, y, threshold){
  threshold = threshold || 4;
  if(x >= HDR_W || y < HDR_H) return -1;
  var rh = sheets[activeSheet].rowH;
  var start = Object.keys(rh).length === 0
    ? Math.max(0, Math.floor((y + scrollTop - HDR_H) / (ROW_H * scale)) - 2)
    : 0;
  for(var r = start; r < ROWS; r++){
    var by = rowY(r) + rH(r);
    if(by < HDR_H - threshold) continue;
    if(by > y + threshold + 100) break;
    if(Math.abs(y - by) <= threshold) return r;
  }
  return -1;
}
function setColW(c, w){
  var old = sheets[activeSheet].colW[c] || COL_W;
  var nw = Math.max(20, Math.round(w));
  undoStack.push({type:'resize', kind:'col', sheet:activeSheet, idx:c, old:old, nw:nw});
  redoStack = [];
  sheets[activeSheet].colW[c] = nw;
}
function setRowH(r, h){
  var old = sheets[activeSheet].rowH[r] || ROW_H;
  var nw = Math.max(15, Math.round(h));
  undoStack.push({type:'resize', kind:'row', sheet:activeSheet, idx:r, old:old, nw:nw});
  redoStack = [];
  sheets[activeSheet].rowH[r] = nw;
}

// マウス
function onMD(e){
  if(e.button!==0) return;
  // refMode中はcommitEditしない・セル参照挿入
  if(getRefInput()){
    var p2=cPos(e);
    if(p2.x>HDR_W&&p2.y>HDR_H){
      var tr=yToR(p2.y),tc=xToC(p2.x);
      insertRefAddr(tr,tc,tr,tc);
      touchState={type:'mrefsel',startR:tr,startC:tc};
      return;
    }
  }
  commitEdit(); hideCtxMenu();
  canvas.focus();
  var p=cPos(e);

  // 列幅リサイズ検出（列ヘッダー境界）
  var rc = getColResizeBorder(p.x, p.y, 4);
  if(rc >= 0){
    touchState={type:'colresize', col:rc, startX:p.x, origW:sheets[activeSheet].colW[rc]||COL_W};
    canvas.style.cursor='col-resize';
    return;
  }
  // 行高リサイズ検出（行ヘッダー境界）
  var rr = getRowResizeBorder(p.x, p.y, 4);
  if(rr >= 0){
    touchState={type:'rowresize', row:rr, startY:p.y, origH:sheets[activeSheet].rowH[rr]||ROW_H};
    canvas.style.cursor='row-resize';
    return;
  }

  // 列ヘッダークリック → 列全体選択
  if(p.y<HDR_H&&p.x>=HDR_W){
    var c=xToC(p.x);
    if(e.shiftKey){
      // Shift+クリック：現在選択からこの列まで拡張
      sel(0, Math.min(selC1,c), ROWS-1, Math.max(selC2,c));
    } else {
      sel(0,c,ROWS-1,c);
    }
    return;
  }

  // 行ヘッダークリック → 行全体選択
  if(p.x<HDR_W&&p.y>=HDR_H){
    var r=yToR(p.y);
    if(e.shiftKey){
      // Shift+クリック：現在選択からこの行まで拡張
      sel(Math.min(selR1,r), 0, Math.max(selR2,r), COLS-1);
    } else {
      sel(r,0,r,COLS-1);
    }
    return;
  }

  if(p.x<HDR_W||p.y<HDR_H) return;
  var c=xToC(p.x),r=yToR(p.y);

  // Shift+セルクリック：範囲拡張
  if(e.shiftKey){
    sel(selR1,selC1,r,c);
    return;
  }

  sel(r,c,r,c);
  touchState={type:'msel',startR:r,startC:c};
}
function onMM(e){
  var p=cPos(e);
  if(touchState&&touchState.type==='mrefsel'&&p.x>HDR_W&&p.y>HDR_H){
    var tr=yToR(p.y),tc=xToC(p.x);
    var el=getRefInput(); if(!el) return;
    var addr=(touchState.startR===tr&&touchState.startC===tc)
      ?cellAddr(touchState.startR,touchState.startC)
      :(cellAddr(Math.min(touchState.startR,tr),Math.min(touchState.startC,tc))+':'+cellAddr(Math.max(touchState.startR,tr),Math.max(touchState.startC,tc)));
    var oldAddr=cellAddr(refStartR,refStartC);
    var pos=el.value.lastIndexOf(oldAddr);
    if(pos>=0) el.value=el.value.substring(0,pos)+addr+el.value.substring(pos+oldAddr.length);
    refStartR=tr; refStartC=tc;
    render(); return;
  }
  if(touchState&&touchState.type==='colresize'){
    var nw=Math.max(10, touchState.origW+(p.x-touchState.startX)/scale);
    sheets[activeSheet].colW[touchState.col]=nw;
    render(); return;
  }
  if(touchState&&touchState.type==='rowresize'){
    var nh=Math.max(15, touchState.origH+(p.y-touchState.startY)/scale);
    sheets[activeSheet].rowH[touchState.row]=nh;
    render(); return;
  }
  // カーソル変更（ドラッグなし時）
  if(!touchState){
    var rc=getColResizeBorder(p.x,p.y,4);
    var rr=getRowResizeBorder(p.x,p.y,4);
    canvas.style.cursor = rc>=0?'col-resize':rr>=0?'row-resize':'default';
  }
  if(!touchState||touchState.type!=='msel') return;
  if(p.x<HDR_W||p.y<HDR_H) return;
  selR2=yToR(p.y); selC2=xToC(p.x); updateBar(); render();
}

// タッチ
function onTS(e){
  // popup上のタッチはcanvas処理をスキップ
  var popup = document.getElementById('ai-response-popup');
  if(popup && popup.classList.contains('show')){
    var pt = e.touches[0];
    var pr = popup.getBoundingClientRect();
    if(pt.clientX >= pr.left && pt.clientX <= pr.right &&
       pt.clientY >= pr.top  && pt.clientY <= pr.bottom){ return; }
  }
  e.preventDefault();
  if(e.touches.length>=2){
    var r=canvas.getBoundingClientRect();
    touchState={type:'pinch',dist:pDist(e),sc:scale,sst:scrollTop,ssl:scrollLeft,
      cx:((e.touches[0].clientX+e.touches[1].clientX)/2)-r.left,
      cy:((e.touches[0].clientY+e.touches[1].clientY)/2)-r.top};
    return;
  }
  var t=e.touches[0],r=canvas.getBoundingClientRect();
  var x=t.clientX-r.left,y=t.clientY-r.top;
  // refMode中: セルタップで参照アドレスを挿入（DOM直接チェック）
  var _refEl=getRefInput();
  if(_refEl&&x>HDR_W&&y>HDR_H){
    var tr=yToR(y),tc=xToC(x);
    refStartR=tr; refStartC=tc;
    insertRefAddr(tr,tc,tr,tc);
    touchState={type:'refsel',startR:tr,startC:tc,r:canvas.getBoundingClientRect()};
    return;
  }
  // 列幅・行高リサイズ検出（タッチは閾値8px）→ resizecheck状態で保留
  var rc=getColResizeBorder(x,y,8);
  if(rc>=0){ touchState={type:'resizecheck',kind:'col',idx:rc,startX:t.clientX,startY:t.clientY,origW:sheets[activeSheet].colW[rc]||COL_W,ssl:scrollLeft,sst:scrollTop}; return; }
  var rr=getRowResizeBorder(x,y,8);
  if(rr>=0){ touchState={type:'resizecheck',kind:'row',idx:rr,startX:t.clientX,startY:t.clientY,origH:sheets[activeSheet].rowH[rr]||ROW_H,ssl:scrollLeft,sst:scrollTop}; return; }
  if(nearHandle(x,y)){
    touchState={type:'handle', origR2:selR2, origC2:selC2}; return;
  }
  touchState={type:'pending',sx:t.clientX,sy:t.clientY,sst:scrollTop,ssl:scrollLeft,time:Date.now(),lpt:null};
  // 長押し500ms → AI解説
  var _lpt = setTimeout(function(){
    if(touchState&&touchState.type==='pending'){
      var r2=canvas.getBoundingClientRect();
      var lx=t.clientX-r2.left, ly=t.clientY-r2.top;
      if(lx>HDR_W&&ly>HDR_H){
        sel(yToR(ly),xToC(lx),yToR(ly),xToC(lx));
        explainCell();
        touchState=null;
      }
    }
  },500);
  touchState.lpt=_lpt;
}
function onTM(e){
  e.preventDefault();
  if(!touchState) return;
  // スクロール開始時に長押しタイマーキャンセル
  if(touchState.lpt){ clearTimeout(touchState.lpt); touchState.lpt=null; }
  // refsel: 参照範囲ドラッグ
  if(touchState.type==='refsel'){
    var t0=e.touches[0];
    var cr=touchState.r;
    var x=t0.clientX-cr.left, y=t0.clientY-cr.top;
    if(x>HDR_W&&y>HDR_H){
      var tr=yToR(y),tc=xToC(x);
      // 入力欄の既存アドレスを新しい範囲で置換
      var el=getRefInput(); if(!el) return;
      var addr=(touchState.startR===tr&&touchState.startC===tc)
        ?cellAddr(touchState.startR,touchState.startC)
        :(cellAddr(Math.min(touchState.startR,tr),Math.min(touchState.startC,tc))+':'+cellAddr(Math.max(touchState.startR,tr),Math.max(touchState.startC,tc)));
      // 最後に挿入したアドレスを新アドレスで置換
      var oldAddr=(refStartR===touchState.startR&&refStartC===touchState.startC)
        ?cellAddr(refStartR,refStartC)
        :(cellAddr(Math.min(touchState.startR,refStartR),Math.min(touchState.startC,refStartC))+':'+cellAddr(Math.max(touchState.startR,refStartR),Math.max(touchState.startC,refStartC)));
      var pos=el.value.lastIndexOf(oldAddr);
      if(pos>=0) el.value=el.value.substring(0,pos)+addr+el.value.substring(pos+oldAddr.length);
      refStartR=tr; refStartC=tc;
      el.selectionStart=el.selectionEnd=el.value.length;
      el.focus();
      render();
    }
    return;
  }
  // resizecheck: 最初の動き方向でリサイズかスクロールか決定
  if(touchState.type==='resizecheck'){
    var t0=e.touches[0];
    var dx=Math.abs(t0.clientX-touchState.startX), dy=Math.abs(t0.clientY-touchState.startY);
    if(dx<4&&dy<4) return; // まだ動いていない
    if(touchState.kind==='col'&&dx>=dy){
      // 横方向 → リサイズ確定
      touchState={type:'colresize',col:touchState.idx,startX:touchState.startX,origW:touchState.origW};
    } else if(touchState.kind==='row'&&dy>=dx){
      // 縦方向 → リサイズ確定
      touchState={type:'rowresize',row:touchState.idx,startY:touchState.startY,origH:touchState.origH};
    } else {
      // 逆方向 → スクロールに切り替え
      touchState={type:'scroll',sx:touchState.startX,sy:touchState.startY,ssl:touchState.ssl,sst:touchState.sst};
    }
    return;
  }
  // 列幅・行高リサイズドラッグ
  if(touchState.type==='colresize'){
    var t0=e.touches[0];
    var nw=Math.max(20, touchState.origW+(t0.clientX-touchState.startX)/scale);
    sheets[activeSheet].colW[touchState.col]=nw;
    render(); return;
  }
  if(touchState.type==='rowresize'){
    var t0=e.touches[0];
    var nh=Math.max(15, touchState.origH+(t0.clientY-touchState.startY)/scale);
    sheets[activeSheet].rowH[touchState.row]=nh;
    render(); return;
  }
  if(e.touches.length>=2&&touchState.type!=='pinch'){
    var r=canvas.getBoundingClientRect();
    touchState={type:'pinch',dist:pDist(e),sc:scale,sst:scrollTop,ssl:scrollLeft,
      cx:((e.touches[0].clientX+e.touches[1].clientX)/2)-r.left,
      cy:((e.touches[0].clientY+e.touches[1].clientY)/2)-r.top};
    return;
  }
  if(touchState.type==='pinch'&&e.touches.length>=2){
    var d=pDist(e),ns=Math.max(0.5,Math.min(4,touchState.sc*(d/touchState.dist)));
    var ratio=ns/touchState.sc;
    scrollLeft=Math.max(0,(touchState.ssl+(touchState.cx-HDR_W))*ratio-(touchState.cx-HDR_W));
    scrollTop=Math.max(0,(touchState.sst+(touchState.cy-HDR_H))*ratio-(touchState.cy-HDR_H));
    scale=ns; render(); return;
  }
  if(e.touches.length!==1) return;
  var t=e.touches[0];
  var dx=t.clientX-touchState.sx,dy=t.clientY-touchState.sy;
  if(touchState.type==='pending'&&(Math.abs(dx)>5||Math.abs(dy)>5)) touchState.type='scroll';
  if(touchState.type==='scroll'){
    scrollLeft=Math.max(0,touchState.ssl-dx);
    scrollTop=Math.max(0,touchState.sst-dy);
    render(); return;
  }
  if(touchState.type==='handle'){
    var r=canvas.getBoundingClientRect();
    var x=t.clientX-r.left,y=t.clientY-r.top;
    if(x>HDR_W&&y>HDR_H){
      selR2=Math.max(selR1,yToR(y)); selC2=Math.max(selC1,xToC(x));
      updateBar(); render();
    }
  }
}
function onTE(e){
  // popup上のタッチはcanvas処理をスキップ
  var popup2 = document.getElementById('ai-response-popup');
  if(popup2 && popup2.classList.contains('show')){
    var pr2 = popup2.getBoundingClientRect();
    var sx = touchState ? touchState.sx : 0, sy = touchState ? touchState.sy : 0;
    if(sx >= pr2.left && sx <= pr2.right &&
       sy >= pr2.top  && sy <= pr2.bottom){ touchState=null; return; }
  }
  e.preventDefault();
  if(touchState && touchState.lpt){ clearTimeout(touchState.lpt); touchState.lpt=null; }
  // 列幅・行高リサイズ確定（undo付き）
  // refsel終了: フォーカスを入力欄に戻す
  if(touchState && touchState.type==='refsel'){
    // カスタムKB方式: focus不要
    touchState=null; render(); return;
  }
  // resizecheck中にタッチ終了（ほぼ動かなかった） → キャンセルしてtap扱い
  if(touchState && touchState.type==='resizecheck'){
    touchState=null; return;
  }
  if(touchState && touchState.type==='colresize'){
    var nw=Math.max(20,Math.round(sheets[activeSheet].colW[touchState.col]||COL_W));
    sheets[activeSheet].colW[touchState.col]=touchState.origW;
    setColW(touchState.col, nw);
    touchState=null; render(); return;
  }
  if(touchState && touchState.type==='rowresize'){
    var nh=Math.max(15,Math.round(sheets[activeSheet].rowH[touchState.row]||ROW_H));
    sheets[activeSheet].rowH[touchState.row]=touchState.origH;
    setRowH(touchState.row, nh);
    touchState=null; render(); return;
  }
  // フィルハンドルドラッグ終了: 元の選択範囲から拡張範囲へフィル
  if(touchState && touchState.type==='handle'){
    var oR2=touchState.origR2, oC2=touchState.origC2;
    var srcRows=oR2-selR1+1, srcCols=oC2-selC1+1;
    if(selR2>oR2){ // 下方向フィル
      for(var fr=oR2+1;fr<=selR2;fr++)
        for(var fc=selC1;fc<=oC2;fc++){
          var sv=getCell(selR1+(fr-selR1)%srcRows,fc).v;
          if(sv!==undefined)setCell(fr,fc,sv);
        }
    }
    if(selC2>oC2){ // 右方向フィル
      for(var fc2=oC2+1;fc2<=selC2;fc2++)
        for(var fr2=selR1;fr2<=selR2;fr2++){
          var sv2=getCell(fr2,selC1+(fc2-selC1)%srcCols).v;
          if(sv2!==undefined)setCell(fr2,fc2,sv2);
        }
    }
    render(); touchState=null; return;
  }
  if(!touchState||touchState.type!=='pending'){touchState=null;return;}
  var r=canvas.getBoundingClientRect();
  var x=touchState.sx-r.left,y=touchState.sy-r.top;
  if(x>HDR_W&&y>HDR_H){
    if(refMode){
      // refMode中: セルタップ→参照アドレス挿入
      var tr=yToR(y),tc=xToC(x);
      refStartR=tr; refStartC=tc;
      insertRefAddr(tr,tc,tr,tc);
      touchState=null; return;
    }
    commitEdit(); canvas.focus();
    var c=xToC(x),r2=yToR(y);
    if(selR1===r2&&selC1===c&&(Date.now()-touchState.time)<400){
      document.getElementById('formula-input').focus();
      document.getElementById('formula-input').select();
    } else { sel(r2,c,r2,c); }
  }
  touchState=null;
}

// キー
function onKD(e){
  if(editingCell) return;
  var ek = e.key.toLowerCase();
  // 全Ctrlショートカット: focusがどこにあっても動作（Excelと同じ挙動）
  if(e.ctrlKey||e.metaKey){
    if(ek==='c'){
      // テキスト選択中はブラウザのコピーに任せる
      if(window.getSelection && window.getSelection().toString()) return;
      e.preventDefault(); ctxCopy(); return;
    }
    if(ek==='v' && copyBuffer){ e.preventDefault(); ctxPaste(); return; }
    if(ek==='z' && !e.shiftKey){ e.preventDefault(); doUndo(); return; }
    if(ek==='y' || (ek==='z' && e.shiftKey)){ e.preventDefault(); doRedo(); return; }
    if(ek==='a'){ e.preventDefault(); sel(0,0,ROWS-1,COLS-1); render(); return; }
    if(e.key==='Home'){ e.preventDefault(); sel(0,0,0,0); scrollTop=0; scrollLeft=0; render(); return; }
    if(e.key==='End'){
      var lr=0,lc=0;
      var dat=sheets[activeSheet].data;
      Object.keys(dat).forEach(function(k){ var p=k.split(','); var ri=parseInt(p[0]),ci=parseInt(p[1]); if(dat[k].v){if(ri>lr)lr=ri;if(ci>lc)lc=ci;} });
      e.preventDefault(); sel(lr,lc,lr,lc); return;
    }
  }
  // 以下はfocusガードあり
  // 入力欄にフォーカスがある場合はキャンバスのキー処理をスキップ
  var _ae = document.activeElement;
  if(_ae && (_ae.tagName==='INPUT'||_ae.tagName==='TEXTAREA'||_ae.tagName==='SELECT')) return;
  var moved=false;

  // Shift+矢印：選択範囲拡張
  if(e.shiftKey){
    if(e.key==='ArrowDown') { selShift(activeR+1,activeC); moved=true; }
    if(e.key==='ArrowUp')   { selShift(activeR-1,activeC); moved=true; }
    if(e.key==='ArrowRight'){ selShift(activeR,activeC+1); moved=true; }
    if(e.key==='ArrowLeft') { selShift(activeR,activeC-1); moved=true; }
  } else {
    if(e.key==='ArrowDown') {moveSel(1,0);moved=true;}
    if(e.key==='ArrowUp')   {moveSel(-1,0);moved=true;}
    if(e.key==='ArrowRight'){moveSel(0,1);moved=true;}
    if(e.key==='ArrowLeft') {moveSel(0,-1);moved=true;}
  }

  if(e.key==='Enter'){startEdit(selR1,selC1);moved=true;}
  if(e.key==='Delete'||e.key==='Backspace'){setCell(selR1,selC1,'');updateBar();render();moved=true;}
  if(e.key==='Home'){ sel(selR1,0,selR1,0); moved=true; }
  if(e.key==='End'){  sel(selR1,COLS-1,selR1,COLS-1); moved=true; }
  if(e.key==='F2'){startEdit(selR1,selC1);moved=true;}
  if(e.key==='Tab'&&!e.shiftKey){moveSel(0,1);moved=true;}
  if(e.key==='Tab'&&e.shiftKey){moveSel(0,-1);moved=true;}
  if(moved) e.preventDefault();
  if(ek.length===1&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){
    e.preventDefault();
    startEdit(selR1,selC1,e.key);
  }
}

function showCtxMenu(x,y){
  var m=document.getElementById('ctx-menu');

  var hr=sheets[activeSheet].hiddenRows||{}, hc=sheets[activeSheet].hiddenCols||{};
  var hasHR=false, hasHC=false;
  for(var r=Math.max(0,selR1-1);r<=Math.min(ROWS-1,selR2+1);r++) if(hr[r]){hasHR=true;break;}
  for(var c=Math.max(0,selC1-1);c<=Math.min(COLS-1,selC2+1);c++) if(hc[c]){hasHC=true;break;}
  document.getElementById('ctx-unhide-row').style.display=hasHR?'block':'none';
  document.getElementById('ctx-unhide-col').style.display=hasHC?'block':'none';
  m.classList.add('show');
  var rect=m.getBoundingClientRect();
  if(rect.right>window.innerWidth) m.style.left=(x-rect.width)+'px';
  if(rect.bottom>window.innerHeight) m.style.top=(y-rect.height)+'px';
}
function hideCtxMenu(){ document.getElementById('ctx-menu').classList.remove('show'); }

function ctxCopy(){
  // 選択範囲の値をタブ区切りでコピー
  var rows=[];
  for(var r=selR1;r<=selR2;r++){
    var row=[];
    for(var c=selC1;c<=selC2;c++) row.push(getCell(r,c).v||'');
    rows.push(row.join('\t'));
  }
  var text=rows.join('\n');
  copyBuffer={r1:selR1,c1:selC1,r2:selR2,c2:selC2,text:text};
  hideCtxMenu();
}

function ctxPaste(){
  if(!copyBuffer) return;
  var rows = copyBuffer.text.split('\n').map(function(r){ return r.split('\t'); });
  var copyRows = rows.length;
  var copyCols = rows[0].length;

  // 1セルコピーの場合は選択範囲全体に展開（Excel動作）
  if(copyRows===1 && copyCols===1){
    var val = rows[0][0];
    for(var r=selR1;r<=selR2;r++)
      for(var c=selC1;c<=selC2;c++) setCell(r,c,val);
  } else {
    // 複数セルコピーは左上から順に貼り付け
    rows.forEach(function(row,ri){
      row.forEach(function(val,ci){ setCell(selR1+ri,selC1+ci,val); });
    });
  }
  render(); hideCtxMenu();
}

function ctxDelete(){
  for(var r=selR1;r<=selR2;r++)
    for(var c=selC1;c<=selC2;c++) setCell(r,c,'');
  updateBar(); render(); hideCtxMenu();
}

  ['num','abc','sym'].forEach(function(t){

    if(panel) panel.style.display=(t===tab)?'block':'none';

function fkbToggle(){
  var kb=document.getElementById('formula-kb');
  var fi=document.getElementById('formula-input');
  var btn=document.getElementById('fkb-toggle');
  if(kb.style.display==='none'||!kb.style.display){
    kb.style.display='block';

    btn.textContent='📝';
    _canvasBCRDirty=true;
    _editMode=true;
    _fiCursorPos=fi.value.length;

    kb.style.display='none';
    fi.removeAttribute('readonly');

function fkbInsert(char){
  var fi=document.getElementById('formula-input');

  v=v.substring(0,_fiCursorPos)+char+v.substring(_fiCursorPos);
  _fiCursorPos+=char.length;
  fi.value=v;
  refMode=(v.length>0&&(v[0]==='='||v[0]==='＝'));
  updateFormulaDisplay(v);
  render();
}
function fkbDelete(){
  var fi=document.getElementById('formula-input');
  var v=fi.value;
  if(_fiCursorPos===0) return;
  v=v.substring(0,_fiCursorPos-1)+v.substring(_fiCursorPos);
  _fiCursorPos--;

  refMode=(v.length>0&&(v[0]==='='||v[0]==='＝'));
  updateFormulaDisplay(v);
  render();
}

// 小数点桁数増減
function toggleDecimal() {
  var cell = getCell(selR1, selC1);
  var fmt = cell.numFmt || '';
  var newFmt;
  if(!fmt || fmt === '#,##0') newFmt = '#,##0.0';
  else if(fmt === '#,##0.0') newFmt = '#,##0.00';
  else if(fmt === '#,##0.00') newFmt = '#,##0';
  else if(fmt === '0') newFmt = '0.0';
  else if(fmt === '0.0') newFmt = '0.00';
  else if(fmt === '0.00') newFmt = '0';
  else newFmt = '#,##0.0';
  applyFormat('numFmt', newFmt);

// 【アップ修正】iOS visual viewport panning 対策
// キーボード出現時にvisualViewport.offsetTop > 0 になり body が「上に消えた」ように見える
// resize + scroll 両方をハンドル（scrollがpanning検知の核心）
function onVisualVP(){
  var vv = window.visualViewport;
  var SHEET_H = 36;
  var kbH = window.innerHeight - Math.round(vv.height) - Math.round(vv.offsetTop);
  document.body.style.height = Math.round(vv.height) + 'px';
  var tabs = document.getElementById('sheet-tabs');
  if(tabs) tabs.style.bottom = Math.max(0, kbH) + 'px';
  // popup が sheet-tabs に重ならないよう位置調整
  var popup = document.getElementById('ai-response-popup');
  if(popup && popup.classList.contains('show')){
    var pt = parseFloat(popup.style.top) || 108;
    var ph = popup.getBoundingClientRect().height || 220;
    // sheet-tabs の上端より上に収まるよう maxBottom を計算
    var maxBottom = Math.round(vv.offsetTop) + Math.round(vv.height) - SHEET_H - 10;
    if(pt + ph > maxBottom){
      popup.style.top = Math.max(60, maxBottom - ph) + 'px';
    }
  }
  dpr = window.devicePixelRatio || 1; resize(); render();
}

var _explainAddr='', _explainFormula='', _explainText='';

function explainCell(){
  hideCtxMenu();
  var addr, prompt, formula=null;
  var isRange=!(selR1===selR2&&selC1===selC2);
  if(isRange){
    var cells=[];
    for(var r=selR1;r<=Math.min(selR2,selR1+9);r++)
      for(var c=selC1;c<=Math.min(selC2,selC1+9);c++){
        var nc=getCell(r,c);
        if(nc&&nc.v) cells.push(cellAddr(r,c)+':'+nc.v);
      }
    addr=cellAddr(selR1,selC1)+':'+cellAddr(selR2,selC2);
    prompt='【範囲解説リクエスト】\n範囲: '+addr+'\n';
    if(cells.length) prompt+='セル内容: '+cells.join(', ')+'\n';
    prompt+='この範囲が何を表しているか1〜3行で簡潔に解説してね。書き込み不要。';
  } else {
    var cell=getCell(selR1,selC1);
    addr=cellAddr(selR1,selC1);
    formula=(cell.f&&cell.f[0]==='=')?cell.f:null;
    var val=cell.v||'';
    var context=[];
    for(var r=Math.max(0,selR1-2);r<=selR1+2;r++)
      for(var c=Math.max(0,selC1-2);c<=selC1+2;c++){
        if(r===selR1&&c===selC1) continue;
        var nc=getCell(r,c);
        if(nc&&nc.v) context.push(cellAddr(r,c)+':'+nc.v);
      }
    prompt='【セル解説リクエスト】\nセル: '+addr+'\n';
    if(formula){ prompt+='数式: '+formula+'\n計算結果: '+val+'\n'; }
    else { prompt+='値: '+(val||'（空）')+'\n'; }
    if(context.length) prompt+='周囲のセル: '+context.slice(0,8).join(', ')+'\n';
    prompt+='このセルが何をしているか1〜3行で簡潔に解説してね。書き込み不要。';
  }
  _explainAddr=addr; _explainFormula=formula||''; _explainText='';
  showExplainPopup(addr,formula,null);
  _sendExplain(prompt);
}

function doWrite(){
  var m = document.getElementById('write-confirm');
  if(!m) return;
  var cells = JSON.parse(m.dataset.cells);
  cells.forEach(function(cell){
    // A1形式をr,cに変換
    var match = cell.addr.match(/^([A-Z]+)(\d+)$/);
    if(!match) return;
    var c = 0;
    for(var i=0;i<match[1].length;i++) c=c*26+(match[1].charCodeAt(i)-64);
    c -= 1;
    var r = parseInt(match[2]) - 1;
    setCell(r, c, cell.value);
  });
  render();
  m.remove();
  // 書き込んだセルを選択
  if(cells.length > 0){
    var first = cells[0].addr.match(/^([A-Z]+)(\d+)$/);
    if(first){
      var c=0; for(var i=0;i<first[1].length;i++) c=c*26+(first[1].charCodeAt(i)-64); c-=1;
      var r=parseInt(first[2])-1;
      sel(r,c,r,c);
    }
  }
}

    var h = localStorage.getItem('exally_popup_h');
    // 画面外に飛ばないようバリデーション
    var rv = parseFloat(r); if(!isNaN(rv) && rv >= 0 && rv < window.innerWidth - 60) popup.style.right = r;
    var tv = parseFloat(t); if(!isNaN(tv) && tv >= 60 && tv < window.innerHeight - 100) popup.style.top = t;
    var hv = parseFloat(h); if(!isNaN(hv) && hv >= 120 && hv <= window.innerHeight * 0.7) popup.style.height = h;
  } catch(e){}
}

function initPopupDrag(){
  var popup = document.getElementById('ai-response-popup');
  var header = document.getElementById('popup-header');
  var pill = document.getElementById('popup-pill');
  if(!popup || !header) return;
  var lpt = null, dragging = false, sx, sy;
  header.addEventListener('touchstart', function(e){
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    lpt = setTimeout(function(){ dragging = true; if(pill) pill.style.background='#52B788'; }, 300);
  },{passive:true});
  header.addEventListener('touchmove', function(e){
    if(!dragging) return;
    e.preventDefault();
    var t = e.touches[0];
    var dx = t.clientX - sx; var dy = t.clientY - sy;
    var rect = popup.getBoundingClientRect();
    var nr = Math.max(0, Math.min(window.innerWidth - 80, window.innerWidth - rect.right - dx));
    var nt = Math.max(60, Math.min(window.innerHeight - 100, rect.top + dy));
    popup.style.right = nr + 'px'; popup.style.top = nt + 'px';
    sx = t.clientX; sy = t.clientY;
  },{passive:false});
  header.addEventListener('touchend', function(){
    clearTimeout(lpt);
    if(dragging){ dragging = false; if(pill) pill.style.background='#3D9E72'; savePopupState(); }
  });
}

function initPopupResize(){
  var popup = document.getElementById('ai-response-popup');
  var handle = document.getElementById('popup-resize-handle');
  if(!popup || !handle) return;
  var resizing = false, sy, sh;
  handle.addEventListener('touchstart', function(e){
    resizing = true; sy = e.touches[0].clientY;
    sh = popup.getBoundingClientRect().height;
    e.preventDefault();
  },{passive:false});
  handle.addEventListener('touchmove', function(e){
    if(!resizing) return;
    e.preventDefault();
    var newH = Math.max(80, Math.min(Math.round(window.innerHeight * 0.7), Math.round(sh + e.touches[0].clientY - sy)));
    popup.style.height = newH + 'px';
  },{passive:false});
  handle.addEventListener('touchend', function(){ if(resizing){ resizing = false; savePopupState(); } });
}




</script>

<div id="popup-overlay" ontouchstart="event.stopPropagation()" ontouchmove="event.stopPropagation()" ontouchend="event.stopPropagation()"></div>
</body>

    <span style="font-size:8px;color:#aaa;margin-left:1px;">長押しで移動</span>
    <button id="popup-close" onclick="closeResponsePopup()">✕</button>
  </div>
  <div id="popup-input-row">
    <textarea id="popup-input" rows="1" placeholder="AIに質問してね..."></textarea>
    <button id="popup-send" onclick="sendToAIMobile()">▶</button>
  </div>
  <div id="popup-response-area"></div>
  <div id="popup-resize-handle"></div>
</div>

  <button class="sheet-tab" onclick="switchSheet(1)">Sheet2</button>

</div>
