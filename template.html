<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>テンプレート - Exally（エクサリー）</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Noto Sans JP','DM Sans',sans-serif;background:#F4F7F5;color:#2E4038;overflow:hidden;}

.layout{display:flex;height:100dvh;width:100%;}
.sidebar{display:none;}
@media(min-width:769px){
.sidebar{display:flex;flex-direction:column;width:220px;min-width:220px;background:#ffffff;border-right:1px solid #D4EDE1;padding:24px 0;height:100dvh;flex-shrink:0;}
.sidebar-logo{padding:0 20px 28px;display:flex;align-items:baseline;gap:5px;text-decoration:none;}
.sidebar-logo-en{font-family:‘DM Mono’,monospace;font-size:22px;font-weight:500;color:#52B788;letter-spacing:-0.5px;}
.sidebar-logo-ja{font-size:10px;color:#7A9A87;}
.sidebar-nav{flex:1;padding:0 12px;display:flex;flex-direction:column;gap:4px;}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;border:none;background:none;font-family:‘Noto Sans JP’,sans-serif;width:100%;text-align:left;color:#7A9A87;font-size:13px;font-weight:500;transition:all 0.18s;}
.sidebar-item:hover{background:#F0FAF4;color:#2E4038;}
.sidebar-item.active{background:#F0FAF4;color:#3D9E72;font-weight:700;}
.sidebar-item.nav-disabled{cursor:not-allowed;opacity:0.45;pointer-events:none;}
.sidebar-item-icon{font-size:18px;width:22px;text-align:center;flex-shrink:0;}
.sidebar-footer{padding:16px 20px;border-top:1px solid #D4EDE1;display:flex;flex-direction:column;gap:8px;}
.sidebar-badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;text-align:center;}
.demo-badge-s{background:#FFF8EE;border:1px solid #F4A942;color:#9A6000;}
.trial-badge-s{background:#F0FAF4;border:1px solid #C8ECD8;color:#3D9E72;}
}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;height:100dvh;}
.mobile-header{background:#ffffff;border-bottom:1px solid #D4EDE1;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.mobile-header-logo{display:flex;align-items:baseline;gap:4px;text-decoration:none;}
.mobile-logo-en{font-family:‘DM Mono’,monospace;font-size:20px;font-weight:500;color:#52B788;}
.mobile-logo-ja{font-size:10px;color:#7A9A87;}
.mobile-header-right{display:flex;gap:6px;align-items:center;}
.hbadge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
.hbadge-warn{background:#FFF8EE;border:1px solid #F4A942;color:#9A6000;}
.hbadge-mint{background:#F0FAF4;border:1px solid #C8ECD8;color:#3D9E72;}
@media(min-width:769px){.mobile-header{display:none;}}
.screen-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#F4F7F5;}
.screen{display:none;}
.screen.active{display:block;}
#screen-template.active{display:flex!important;flex-direction:column;}
.bottom-nav{background:#ffffff;border-top:1px solid #D4EDE1;display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(30,60,40,0.06);}
.nav-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 1px 5px;cursor:pointer;border:none;background:none;font-family:‘Noto Sans JP’,sans-serif;position:relative;}
.nav-item .nav-icon{font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;height:16px;}
.nav-item .nav-icon svg{width:15px;height:15px;}
.nav-item .nav-label{font-size:9px;letter-spacing:-0.3px;color:#7A9A87;margin-top:2px;white-space:nowrap;}
.nav-item.active .nav-label{color:#3D9E72;font-weight:700;}
.nav-item.nav-disabled{cursor:not-allowed;opacity:0.45;pointer-events:none;}
.nav-badge{position:absolute;top:4px;right:calc(50% - 12px);width:6px;height:6px;background:#E05555;border-radius:50%;border:1.5px solid #ffffff;display:none;}
.nav-badge.show{display:block;}
@media(min-width:769px){.bottom-nav{display:none;}}

/* テンプレ ギャラリー */
.tmpl-iframe-screen{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;flex-direction:column;background:#F4F7F5;}
.tmpl-iframe-screen.show{display:flex;}
@media(max-width:768px){.tmpl-iframe-screen{bottom:calc(62px + env(safe-area-inset-bottom));}}
.tmpl-iframe-bar{background:#fff;border-bottom:1px solid #E0EDE6;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.tmpl-iframe-back{background:none;border:1.5px solid #E0EDE6;color:#3D9E72;font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:‘Noto Sans JP’,sans-serif;}
.tmpl-iframe-title{font-size:13px;font-weight:700;color:#4A6B5A;}
.tmpl-iframe-wrap{flex:1;overflow:clip;}
.tmpl-iframe-wrap iframe{width:100%;height:100%;border:none;}
.tmpl-gallery{padding:20px 16px 20px;max-width:860px;margin:0 auto;}
@media(min-width:769px){.tmpl-gallery{padding:32px 40px 40px;}}
.tmpl-gallery-title{font-size:18px;font-weight:700;color:#1A2B22;margin-bottom:4px;}
.tmpl-gallery-sub{font-size:12px;color:#7A9A87;margin-bottom:20px;line-height:1.6;}
.tmpl-cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(min-width:600px){.tmpl-cards-grid{grid-template-columns:repeat(3,1fr);}}
.tmpl-card-item{background:#fff;border-radius:16px;overflow:hidden;border:1.5px solid #E0EDE6;cursor:pointer;transition:all 0.18s;box-shadow:0 1px 4px rgba(30,60,40,0.07);}
.tmpl-card-item:hover{border-color:#52B788;transform:translateY(-2px);box-shadow:0 6px 20px rgba(30,60,40,0.12);}
.tmpl-card-preview{height:170px;background:#F8FEFA;overflow:hidden;position:relative;}
.tmpl-card-preview::after{content:’’;position:absolute;bottom:0;left:0;right:0;height:44px;background:linear-gradient(transparent,#F8FEFA);pointer-events:none;z-index:2;}
.preview-inner{width:100%;position:relative;transform:scale(0.70);transform-origin:top center;pointer-events:none;z-index:1;overflow:hidden;}
.preview-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#B0C4BA;gap:6px;}
.preview-placeholder-icon{font-size:28px;}
.preview-placeholder-text{font-size:10px;}
.tmpl-card-preview-note{position:absolute;bottom:4px;right:6px;font-size:9px;color:#B0C4BA;z-index:3;}
.tmpl-card-body{padding:4px 8px 4px;}
.tmpl-card-name{font-size:12px;font-weight:700;color:#1A2B22;margin-bottom:0;}
.tmpl-card-desc{display:none;}

/* 戻るリンク */
.tmpl-back-link{background:none;border:none;font-size:13px;color:#3D9E72;font-weight:700;cursor:pointer;padding:0 0 12px 0;display:flex;align-items:center;gap:4px;font-family:‘Noto Sans JP’,sans-serif;}

/* トースト */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1A4A2E;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:700;z-index:500;opacity:0;transition:opacity 0.2s;pointer-events:none;}
.toast.show{opacity:1;}
@media(min-width:769px){.toast{bottom:30px;}}
</style>

</head>

window.TEMPLATES = TEMPLATES;

// ===== トースト =====
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

// ===== ギャラリー描画 =====
function renderTmplGallery(){
  var grid=document.getElementById('tmplCardsGrid');
  if(!grid||!window.TEMPLATES) return;
  grid.innerHTML=TEMPLATES.map(function(t){
    var previewContent=t.previewHTML
      ?'<div class="preview-inner">'+t.previewHTML+'</div>'
      :'<div class="preview-placeholder"><div class="preview-placeholder-icon">📄</div><div class="preview-placeholder-text">準備中✨</div></div>';
    return '<div class="tmpl-card-item" onclick="openTmplIframe(\''+t.id+'\')">'
      +'<div class="tmpl-card-preview">'+previewContent+'<div class="tmpl-card-preview-note">※完成イメージ</div></div>'
      +'<div class="tmpl-card-body"><div class="tmpl-card-name">'+(t.hot?'⭐ ':'')+t.name+'</div></div></div>';
  }).join('');
}

// ===== テンプレiframe開閉 =====
function openTmplIframe(id){
  var tmpl=TEMPLATES.find(function(t){ return t.id===id; });
  if(!tmpl) return;
  if(!tmpl.file){ showToast('準備中だよ✨'); return; }
  document.getElementById('tmplIframeTitle').textContent=tmpl.name;
  document.getElementById('tmplIframe').src=tmpl.file;
  document.getElementById('tmplIframeScreen').classList.add('show');
  document.getElementById('tmplGallery').style.display='none';
}

function closeTmplIframe(){
  document.getElementById('tmplIframeScreen').classList.remove('show');
  document.getElementById('tmplIframe').src='';
  document.getElementById('tmplGallery').style.display='block';
}

// ===== 初期化（?open=xxx でiframe自動オープン）=====
document.addEventListener('DOMContentLoaded', function(){
  renderTmplGallery();
  try{
    var params = new URLSearchParams(location.search);
    var openId = params.get('open');
    if(openId){
      openTmplIframe(openId);
    }
  }catch(e){}
});
</script>
