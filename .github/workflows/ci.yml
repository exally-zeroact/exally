name: CI

# Exally（ハブ・台帳・集計・ブック）と 給与(kyuyo/) を1つのワークフローで回す。
#  ・統合前の2リポジトリのCIを【そのまま並べた】もの。実行方式も内容も変えていない。
#  ・kyuyo/ は payslip-app の内部レイアウトをそのまま持ち込んでいるので、相対パスは無改変で通る。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ★依存は「使う前」に入れる。CIは毎回まっさらな環境で走るので、
      #   ローカルで緑でも node_modules が無ければ jsdom を使うテストが SKIP になり、
      #   テスト側は「SKIPを緑と呼ばない」作りなので赤になる（その振る舞いが正しい）。
      - name: Install test deps (jsdom / jsqr)
        run: npm install --no-audit --no-fund

      # ── Exally 由来（据置） ──
      - name: Cache-buster stamp guard (貼り忘れ検知・コードより先に見る)
        run: node scripts/stamp-build.mjs --check
      - name: Stamp tool tests (ハッシュが決定論か=CRLF/LF・OS差でブレないか)
        run: node tests/stamp.test.mjs
      - name: Exally tests (共有データ/集計/台帳→実績値/横断集計/ハブUI/xlsxハーネス)
        run: node tests/run.js
      - name: ★重複ガード (同じ物が2箇所に無いか・法定データは例外なし)
        run: node tests/no-duplicate-libs.test.mjs
      - name: ★参照ガード (require/importの先が実在するか・api/が実際に読み込めるか)
        run: node tests/refs-resolve.test.mjs && node tests/refs-resolve.test.mjs --self-test
      - name: ★チャットAPIの基準数値 (実数リテラル・NaNが静かに入らないか)
        run: node tests/api-claude.test.mjs
      - name: ★法定値の直書きガード (率・額が説明文に固定されていないか)
        run: node tests/no-hardcoded-statutory.test.mjs && node tests/no-hardcoded-statutory.test.mjs --self-test
      - name: ★契約v0 (レジストリ / 契約の線=呼ばれているか・面を呼び返していないか)
        run: node tests/op-registry.test.mjs && node tests/op-boundary.test.mjs && node tests/op-boundary.test.mjs --self-test
      - name: ★iPhoneで動かない書き方ガード (type=month / octet-stream / writeFile / Blob散在)
        run: node tests/ios-unsupported.test.mjs && node tests/ios-unsupported.test.mjs --self-test
      - name: ★ファイルの渡し方 (種類・スマホは共有シート・PCは落ちる)
        run: node kyuyo/tests/file-out.test.mjs
      - name: ★最低賃金 47県が公式の実額と一致 (前科のある行・1円単位)
        run: node kyuyo/tests/saitei-official.test.mjs
      - name: ★最低賃金を県ごとの発効日で判定 (誤警告ゼロ＋本物の割れを見逃さない)
        run: node kyuyo/tests/saitei-hatsuko.test.mjs
      - name: ★法定データの出典・確認日・指紋 (率を変えたら確認日が自己失効する)
        run: node kyuyo/tests/statutory-freshness.test.mjs && node kyuyo/tests/statutory-freshness.test.mjs --self-test
      - name: ★中央statutoryの写しが最新か (出典/確認日/指紋・最賃47県)
        run: node kyuyo/scripts/pull-statutory.mjs --check
      - name: ★app.jsの道とオペの道が同じ物を作るか (新旧AOA完全一致)
        run: node kyuyo/tests/ops-app-parity.test.mjs
      - name: ★契約が実データの書き方を受け取れるか (画面の選択肢を機械で突き合わせ)
        run: node kyuyo/tests/ops-real-values.test.mjs
      - name: ★源泉区分(204条) 選べるのに算式が無い区分を残さない＋実数1円一致
        run: node kyuyo/tests/gensen-kubun.test.mjs && node kyuyo/tests/gensen-kubun.test.mjs --self-test
      - name: CI coverage guard (CIから黙って外れているテストが無いか=除外は理由と戻す条件つきのみ)
        run: node tests/ci-coverage.test.mjs

      # ── 給与(kyuyo/) 由来（据置） ──
      - name: Payroll unit tests (依存なし・実数リテラル+回帰)
        run: node kyuyo/tests/run.js
      - name: Payroll integration (jsdomで本物のapp.jsを読み配線/UI/状態/描画)
        run: node kyuyo/tests/integration.mjs
      - name: Payroll full-feature real-data (給与全パターン)
        run: node kyuyo/tests/payroll-patterns.mjs
      - name: Payroll UI smoke (全ボタンをクリックしてJS例外0)
        run: node kyuyo/tests/ui-smoke.mjs
      - name: Payroll cloud sync (保存層・Supabaseモック)
        run: node kyuyo/tests/cloud-sync.mjs
      - name: Payroll pagination (1000件超が黙って欠落しない)
        run: node kyuyo/tests/pagination.test.mjs
      - name: Payroll meisai store (Web明細 公開一覧/削除時リンク失効)
        run: node kyuyo/tests/meisai-store.mjs
      - name: Payroll QR (復号)
        run: node kyuyo/tests/qr.test.mjs
      - name: Payroll 年末調整 (Web申告/計算)
        run: node kyuyo/tests/nencho-web-declaration.test.js && node kyuyo/tests/nencho-compute.test.mjs
      - name: Golden freeze guard (移設前の真値と入力fixtureが作り直されていないか)
        run: node kyuyo/tests/golden-immutable.test.mjs
      - name: Headless guard (lib/ がDOM・通信・非決定性に依存しない)
        run: node kyuyo/scripts/verify-headless.mjs
      - name: Ops golden parity (★1円一致★ 移設前ゴールデン vs ops/payroll.monthly)
        run: node kyuyo/tests/ops-golden-parity.test.mjs
      - name: Ops statutory (官公値の実数リテラル・Excel同一ソース・テストAPI非露出)
        run: node kyuyo/tests/ops-payroll-monthly.test.mjs
      - name: Law switchpoints (健保R7→R8/支援金2026-04/雇用保険年度/最賃年度の境界前後)
        run: node kyuyo/tests/law-switchpoints.test.mjs
      - name: Periods golden (期間分割K2が移設前と一致)
        run: node kyuyo/tests/periods-golden.test.mjs
      - name: Fixture reproducibility (入力fixtureが生成スクリプトと一致するか)
        run: node kyuyo/scripts/make-input-fixture.mjs --check && node kyuyo/scripts/make-periods-fixture.mjs --check
      - name: Statutory drift guard (lib == 中央statutory)
        run: node kyuyo/scripts/verify-statutory.mjs
