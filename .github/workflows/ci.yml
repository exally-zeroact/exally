name: CI

# Exally（ハブ・台帳・集計・ブック）を回す。
# ★2026-09-05★ 給与(kyuyo/)は Exally から 外した＝給与は Rakunally（司さんの決め）。
#  ・統合前の2リポジトリのCIを【そのまま並べた】もの。実行方式も内容も変えていない。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ★依存は「使う前」に入れる。CIは毎回まっさらな環境で走るので、
      #   ローカルで緑でも node_modules が無ければ jsdom を使うテストが SKIP になり、
      #   テスト側は「SKIPを緑と呼ばない」作りなので赤になる（その振る舞いが正しい）。
      - name: Install test deps (jsdom / jsqr)
        run: npm install --no-audit --no-fund

      # ── Exally 由来（据置） ──
      - name: ★試験は登録するまで1本も走らない (在る試験と 走る試験を突き合わせる)
        run: node scripts/tests-registered.mjs
      - name: ★その見張り自身の自己確認 (わざと壊して赤になるか)
        run: node scripts/tests-registered.mjs --self-test
      - name: ★AIの頭が 台帳と ずれていないか（prompt/ は 機械が 作る）
        # ★手書きの「使えない関数」22個のうち ★17個が 間違い★だった（2026-09-05 実測）
        #   足してあるのに「使えない」…4個／動かないのに 教えていない…13個
        #   しかも 前置きは「LET・LAMBDA等を 積極的に 提案」＝★動かない式を 勧めていた★
        run: node scripts/make-prompt.mjs --check
      - name: Cache-buster stamp guard (貼り忘れ検知・コードより先に見る)
        run: node scripts/stamp-build.mjs --check
      - name: Stamp tool tests (ハッシュが決定論か=CRLF/LF・OS差でブレないか)
        run: node tests/stamp.test.mjs
      - name: Exally tests (共有データ/集計/台帳→実績値/横断集計/ハブUI/xlsxハーネス)
        run: node tests/run.js
      - name: ★重複ガード (同じ物が2箇所に無いか・法定データは例外なし)
        run: node tests/no-duplicate-libs.test.mjs
      - name: ★参照ガード (require/importの先が実在するか・api/が実際に読み込めるか)
        run: node tests/refs-resolve.test.mjs && node tests/refs-resolve.test.mjs --self-test
      - name: ★チャットAPIの基準数値 (実数リテラル・NaNが静かに入らないか)
        run: node tests/api-claude.test.mjs
      - name: ★法定値の直書きガード (率・額が説明文に固定されていないか)
        run: node tests/no-hardcoded-statutory.test.mjs && node tests/no-hardcoded-statutory.test.mjs --self-test
      - name: ★契約v0 (レジストリ / 契約の線=呼ばれているか・面を呼び返していないか)
        run: node tests/op-registry.test.mjs && node tests/op-boundary.test.mjs && node tests/op-boundary.test.mjs --self-test
      - name: ★iPhoneで動かない書き方ガード (type=month / octet-stream / writeFile / Blob散在)
        run: node tests/ios-unsupported.test.mjs && node tests/ios-unsupported.test.mjs --self-test
      - name: ★版対応 (その式が相手のExcelで動くか・Excelに無い23個/版マーカー14個)
        run: node tests/excel-version.test.mjs && node tests/excel-version.test.mjs --self-test
      - name: ★グリッド→xlsx の変換 (落ちる物の警告・実際に書いて読み戻す)
        run: node tests/grid-xlsx.test.mjs
      - name: ★グリッドの日付 (打った日付が日付になる / 売上の数を日付に化けさせない / 書き出しと同じ規則)
        run: node tests/grid-date.test.mjs && node tests/grid-date.test.mjs --self-test
      - name: ★渡した相手の画面で ######## にならないか (日付の列に幅を付けて書き出す)
        run: node tests/grid-colwidth.test.mjs && node tests/grid-colwidth.test.mjs --self-test
      - name: ★設定ファイルに知らない項目/説明文が混ざっていないか (混ぜるとデプロイがビルド前に止まる)
        run: node tests/config-schema.test.mjs && node tests/config-schema.test.mjs --self-test
      - name: ★空振りしているテストが無いか (SKIPを緑と呼んでいないか・逃げ道/除外の一覧)
        run: node tests/hollow-guard.test.mjs --self-test && node tests/hollow-guard.test.mjs
      - name: ★入口の見張りの「判定」が空振りしていないか (外へ出ない部分だけ・実際の死活は hosts.yml 週1)
        run: node scripts/check-hosts.mjs --self-test
      - name: CI coverage guard (CIから黙って外れているテストが無いか=除外は理由と戻す条件つきのみ)
        run: node tests/ci-coverage.test.mjs

      # ── 給与(kyuyo/) 由来（据置） ──